<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>块</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0d11;
        --panel: #12151b;
        --line: #232833;
        --text: #e6e9ef;
        --muted: #8b93a7;
        --accent: #8b9dff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace;
        display: flex;
        justify-content: center;
        padding: 48px 20px;
      }
      main { width: 100%; max-width: 560px; }
      h1 { font-size: 16px; margin: 0 0 4px; font-weight: 600; letter-spacing: -0.01em; }
      .sub { color: var(--muted); font-size: 12px; margin: 0 0 24px; word-break: break-all; }
      form { display: flex; gap: 8px; margin-bottom: 20px; }
      input {
        flex: 1; min-width: 0; height: 34px; padding: 0 10px;
        background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
        color: var(--text); font: inherit; outline: none;
      }
      input:focus { border-color: #2f3542; }
      button {
        height: 34px; padding: 0 14px; border: 1px solid var(--line); border-radius: 6px;
        background: var(--panel); color: var(--text); font: inherit; cursor: pointer;
      }
      button:hover { border-color: #2f3542; }
      ul { list-style: none; margin: 0; padding: 0; }
      li {
        display: flex; align-items: baseline; gap: 10px;
        padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13px;
      }
      li time { margin-left: auto; color: var(--muted); font-size: 11px; }
      .empty { color: var(--muted); font-size: 13px; }
      footer { margin-top: 28px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--muted); }
      a { color: var(--accent); text-decoration: none; }
      a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">块</h1>
      <p class="sub" id="sub">正在问 /api/health…</p>

      <form id="add">
        <input id="text" placeholder="写点什么，回车存下来" autocomplete="off" />
        <button type="submit">加一条</button>
      </form>

      <ul id="list"><li class="empty">还没有。</li></ul>

      <footer>
        这一页和它的 API 都在你自己的文件夹里。数据存在 <code>data/notes.json</code>，
        <code>cp -r</code> 走就带走了。<br />
        <span id="links"></span>
      </footer>
    </main>

    <script>
      // 所有地址都是相对的：在宿主的前缀底下、在自己域名底下、在 localhost 底下，同一份代码。
      const api = (p) => new URL(p, document.baseURI).toString();

      const el = {
        title: document.getElementById("title"),
        sub: document.getElementById("sub"),
        list: document.getElementById("list"),
        form: document.getElementById("add"),
        text: document.getElementById("text"),
        links: document.getElementById("links"),
      };

      const draw = (notes) => {
        el.list.innerHTML = notes.length
          ? notes
              .map(
                (n) =>
                  `<li><span>${n.text.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c])}</span><time>${new Date(n.at).toLocaleTimeString()}</time></li>`,
              )
              .join("")
          : '<li class="empty">还没有。</li>';
      };

      const load = async () => {
        const notes = await fetch(api("api/notes")).then((r) => r.json());
        draw(notes.notes ?? []);
      };

      el.form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const text = el.text.value.trim();
        if (!text) return;
        el.text.value = "";
        await fetch(api("api/notes"), {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ text }),
        });
        await load();
      });

      (async () => {
        try {
          const me = await fetch(api("api/health")).then((r) => r.json());
          el.title.textContent = me.id;
          el.sub.textContent = me.self || me.data;
          el.links.innerHTML = [
            `<a href="${me.self}/__nous/doc">笔记</a>`,
            `<a href="${me.self}/__nous/ctx">上下文</a>`,
            `<a href="api/health" target="_blank">/api/health</a>`,
          ].join(" · ");
          await load();
        } catch {
          el.sub.textContent = "连不上 /api/health —— 看看终端里的报错。";
        }
      })();
    </script>
  </body>
</html>
