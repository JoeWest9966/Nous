# 依赖契约图表（`verify.sh` §4e 的机器可读真相）
#
# 人读的说明在 `docs/harness.md` §7；这里是同一张表的机器版。
# `verify.sh` 从本文件读 allow 集合：对每个 `nous-*` 依赖，若其名字不在
# 对应包的 `allow` 列表里就报「依赖边不在契约图表里」。判定阈值与断言未变。

[allow]
nous-telemetry = []
nous-chord = []
nous-wire = []
# 端点自带 handler（GET /v1/fs/dirs）之后多了 nous-routes。远端分支是宿主能力
# trait —— nous-env-ssh 的 requires 里有本 crate，反向依赖会成环。
nous-env = ["nous-chord", "nous-routes"]

# 私库层：`Refusal`（`RepoError → 状态码` 的唯一翻译）也在这里 —— 它拥有 `RepoError`，
# 翻译自己家的错误，依赖方向永远是对的。放 `nous-routes` 会成环（`env → routes → repo → env`）。
nous-repo = ["nous-env"]
nous-ai = ["nous-telemetry", "nous-ai-types"]
nous-tools = ["nous-ai", "nous-env"]
nous-runtime = ["nous-ai"]
nous-durable = ["nous-chord", "nous-ai", "nous-wire", "nous-telemetry", "nous-env", "nous-ai-types"]

# 元素库只碰私库原语（写一次提交一次的原子事务在 repo 里），不自己 spawn git；
# 端点也归本插件，所以还要 axum / nous-routes 和一条路径解析（nous-env）。
nous-elements = ["nous-env", "nous-repo", "nous-routes"]

# 技能插件：解析层只读盘面；端点归本插件后要 axum / nous-routes，
# 盘面规矩（名字校验、清单、骨架、发布）走 nous-repo::entries，路径解析走 nous-env。
nous-skills = ["nous-env", "nous-repo", "nous-routes"]

# 模板插件：形状与 skills 一样（只读投影 + 编辑面），盘面规矩走 nous-repo::entries。
nous-prompts = ["nous-env", "nous-repo", "nous-routes"]


# #73 dispatcher 用 durable sleeping 任务落 tick、store 读写账本、chord 处理增量。
nous-dispatcher = ["nous-chord", "nous-durable", "nous-store"]

# nous-server 是组装根：它必须摸到这些层才能把 HTTP 面拼起来。
# #56/#44/#47/#48/#49/#51 的原始边；#65 device、#71/#83 skills、#78 env-ssh、
# #75 repo、#81 ext、#62 stats、#60 presets 的边由 #89 按实际代码补齐；
# #73 dispatcher 的边由本次合并按实际代码补上。
nous-server = [
  "nous-durable", "nous-wire", "nous-telemetry",
  "nous-ai", "nous-runtime", "nous-sessions", "nous-tools",
  "nous-store", "nous-env",
  # #73 调度节拍的 evaluate 纯判定由 server 复用
  "nous-dispatcher",
  # #65 机器/模型编目
  "nous-device",
  # #78 远端执行环境
  "nous-env-ssh",
  # #81 扩展管理面（create/duplicate/install/类别词表/usage）
  "nous-ext",
  # #72 prompts 的目录只读投影 + #71/#83 skills（解析层 + 自带 6 条端点）
  "nous-prompts", "nous-skills",
  # #75 五套私库文件面 + #76 variant + #77 upstream
  "nous-repo",
  # 元素库（组 / 包）的 HTTP 面
  "nous-elements",
  # #62 只读观测聚合
  "data-data-manager",
  # #67 会话归档三端点（世代文件 + 墓碑 + 打捞）
  "data-archive",
  # 模型编目插件（元素组 → 编目）：server 调它的投影与端点
  "element-models",
  # 端点契约层（插件自带 handler 的声明 = 注册）
  "nous-routes",
  # #60 模板管理的判定层（形状 / 引用解析 / 名册投影）
  "nous-presets-admin",
  # #73 60s 节拍与 evaluate 在 app 装配处启动
  "nous-dispatcher",
]

# #56 Nous 自己的库，没有内部依赖（尤其没有 nous-durable）—— 多一条边就是判据 1 破。
nous-store = []

# #60 模板管理：纯判定，零 IO（盘面与 HTTP 都在 server）。
# 端点也归本插件（#60 搬家）：handler 在插件里，所以要 axum / nous-routes、
# 私库原语（nous-repo 的 sha256 与 git 面）、插件库（nous-store 的修订表）、
# 路径解析（nous-env）、编目投影（nous-device）、提示词名册（nous-prompts）。
nous-presets-admin = ["nous-device", "nous-env", "nous-prompts", "nous-repo", "nous-routes", "nous-store"]

# 端点契约层：只认 axum 的 MethodRouter 形状，不依赖任何插件（否则会和 server 成环）。
nous-routes = []

# 编目插件的依赖：元素库原语、运行时配置形状、宿主能力的类型（repo），以及端点契约层。
element-models = ["nous-elements", "nous-runtime", "nous-env", "nous-repo", "nous-routes"]

# #67 归档插件：三条命令走 durable 的 session commands（活库写锁与补偿方向都在那里），
# 端点契约由 nous-routes 声明。不依赖 server（否则成环）。
data-archive = ["nous-durable", "nous-routes"]
