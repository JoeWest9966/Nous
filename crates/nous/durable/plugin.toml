name = "durable"
vendor = "nous"
version = "0.1.21"          # 必须 == Cargo.toml 的 version
layer = "kernel"          # 必须 == docs/plugins.md 的 layer 列
crate = "nous-durable"

[requires]                 # cargo metadata 里的内部 workspace 依赖
nous-ai-types = "^0.1"
nous-chord = "^0.1"
nous-wire = "^0.1"

[provides]
capability = "durable"
endpoints  = []         # 本票一律留空；端点由 #48 的注册表生成
