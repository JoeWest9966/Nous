name = "stats"
vendor = "nous"
version = "0.1.13"          # 必须 == Cargo.toml 的 version
layer = "app"          # 必须 == docs/plugins.md 的 layer 列
crate = "nous-stats"

[requires]                 # cargo metadata 里的内部 workspace 依赖
nous-chord = "^0.1"
nous-durable = "^0.1"
nous-store = "^0.1"

[provides]
capability = "stats"
endpoints  = []         # 本票一律留空；端点由 #48 的注册表生成
