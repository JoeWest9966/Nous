name = "stats"
vendor = "nous"
version = "0.2.4"  # 插件自己的版本（semver，独立演进；docs/plugins.md 规则 8）
layer = "app"          # 必须 == docs/plugins.md 的 layer 列
crate = "nous-stats"

[requires]                 # cargo metadata 里的内部 workspace 依赖
nous-chord = "^0.1"
nous-durable = "^0.1"
nous-store = "^0.1"

[provides]
capability = "stats"
endpoints  = []         # 本票一律留空；端点由 #48 的注册表生成
