name = "server"
vendor = "nous"
version = "0.1.10"          # 必须 == Cargo.toml 的 version
layer = "app"          # 必须 == docs/plugins.md 的 layer 列
crate = "nous-server"

[requires]                 # cargo metadata 里的内部 workspace 依赖
nous-ai = "^0.1"
nous-dispatcher = "^0.1"
nous-durable = "^0.1"
nous-ext = "^0.1"
nous-device = "^0.1"
nous-env = "^0.1"
nous-repo = "^0.1"
nous-prompts = "^0.1"
nous-env-ssh = "^0.1"
nous-skills = "^0.1"
nous-runtime = "^0.1"
nous-sessions = "^0.1"
nous-stats = "^0.1"
nous-store = "^0.1"
nous-telemetry = "^0.1"
nous-tools = "^0.1"
nous-wire = "^0.1"

[provides]
capability = "server"
endpoints  = []         # 本票一律留空；端点由 #48 的注册表生成
