[package]
name = "nous-env"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "ExecutionEnv 契约：FileSystem + Shell 两张 trait 面（形状取 pi-durable 的 env，无内部依赖）"
readme = "README.md"

# AGENTS.md §二：nous-env → nous-chord，只为 Context（取消与进度用 chord 那一份，
# 不另造第二套）。除此之外只允许 async-trait / tokio-util；
# 出现 nous-ai / nous-durable / nous-tools / reqwest / rusqlite 就是契约图破了。
[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
tokio-util = { workspace = true }
nous-chord = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
