layer = "app"          # 必须 == docs/plugins.md 的 layer 列
crate = "nous-ext"

[requires]                 # cargo metadata 里的内部 workspace 依赖
nous-durable = "^0.1"
nous-ext-sdk = "^0.1"

[provides]
capability = "ext"
endpoints  = []         # 本票一律留空；端点由 #48 的注册表生成
