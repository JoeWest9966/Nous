[package]
name = "nous-durable"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "durable 的语义自己写：storage / session / harness（AGENTS.md §一：只借语义和坑，不借结构）"
readme = "README.md"

# 契约面（AGENTS.md §二）：nous-durable → chord, ai, wire, telemetry, env。
# **工具靠 `nous-ai::Tool` trait 注入** —— 这里永远不该出现 `nous-tools`
# （判据：`cargo tree -p nous-durable` 里没有 nous-tools）。
# 12a 只用到 chord 的 sqlite / json 两层，其余等真用到再加，不预先绑。
[dependencies]
nous-chord = { workspace = true }
# `harness`（#14）用它的 `AssistantMessageEvent` / `utils::streaming_json`。
# 契约面允许这一条（`AGENTS.md` §二：`nous-durable → chord, ai, wire, telemetry, env`）。
nous-ai = { workspace = true }
# `harness::project` 的产出类型是 `nous_wire::MessageChange`（`wire.md` 的 Rust 投影）。
# 契约面里有这一条；事件只在这一层"成形"，传输仍然在 `nous-server`（#22）。
nous-wire = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# 判据要读虚拟时钟（`start_paused`）：`harness_stream_commits_partials_at_most_every_interval`
# 的四条都只能靠时间线判，而「用 sleep 猜」在负载下必假红。`test-util` 只进测试。
[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

# 生产代码**不**拿 `nous_ai::Message` 解析库里存的 `model` —— 那正是
# `docs/pitfalls-from-pi.md` 里那条「引擎写进库的数据比类型宽」的坑（#23 已删掉那条断言）。

# `verify.sh` 的 1b 按这个名字找一致性套件；文件放在 `conformance/` 下，不混进 `tests/`。
[[test]]
name = "conformance"
path = "conformance/storage_conformance.rs"
