name = "Nous_Extend"
vendor = "Nous"
version = "0.8.0"  # 插件自己的版本（semver，独立演进；docs/plugins.md 规则 8）
                   # 0.6.6 → 0.8.0：目录/包名/全名改名（身份变更 = minor）+ 15 条端点归本插件（= minor）
layer = "app"          # 必须 == docs/plugins.md 的 layer 列
crate = "nous-extend"

[requires]                 # cargo metadata 里的内部 workspace 依赖
nous-durable = "^0.1"
nous-ext-sdk = "^0.1"
nous-repo = "^0.1"
nous-routes = "^0.1"

[provides]
capability = "extend"
