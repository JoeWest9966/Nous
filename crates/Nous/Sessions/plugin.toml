name = "sessions"
vendor = "Nous"
version = "0.7.0"  # 读投影 / 写命令 / 请求形状三层下沉进本插件（新公开面）= minor
layer = "app"          # 必须 == docs/plugins.md 的 layer 列
crate = "nous-sessions"

