name = "env"
vendor = "Nous"
version = "0.3.3"  # 插件自己的版本（semver，独立演进；docs/plugins.md 规则 8；0.3.3：BrowseError 用 u16 + JSON 体构造 HttpRefusal）
layer = "platform"          # 必须 == docs/plugins.md 的 layer 列
crate = "nous-env"

[requires]                 # cargo metadata 里的内部 workspace 依赖
nous-chord = "^0.1"
nous-routes = "^0.1"       # 端点契约（自带 handler：GET /v1/fs/dirs）

[provides]
capability = "env"
