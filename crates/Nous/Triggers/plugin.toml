name = "Nous_Triggers"
vendor = "Nous"
version = "0.1.0"     # 插件自己的版本（semver，独立演进；docs/plugins.md 规则 8）
                      # 出生即全名（规则 12）：不再走「先短名再改名」那一趟
layer = "app"         # 必须 == docs/plugins.md 的 layer 列
crate = "nous-triggers"

[requires]                 # cargo metadata 里的内部 workspace 依赖
nous-store = "^0.1"
nous-durable = "^0.1"
nous-sessions = "^0.1"
nous-ai = "^0.1"
nous-dispatcher = "^0.1"
nous-repo = "^0.1"
nous-tools = "^0.1"
nous-routes = "^0.1"

[provides]
capability = "triggers"
