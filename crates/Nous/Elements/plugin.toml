name = "elements"
vendor = "Nous"
version = "0.3.0"  # 插件自己的版本（semver，独立演进；docs/plugins.md 规则 8；8 条端点归本插件 = minor）
layer = "app"          # 必须 == docs/plugins.md 的 layer 列
crate = "nous-elements"

[requires]                 # cargo metadata 里的内部 workspace 依赖
nous-env = "^0.1"
nous-repo = "^0.1"
nous-routes = "^0.1"

[provides]
capability = "elements"
