name = "server"
vendor = "Nous"
version = "0.3.25"  # 插件自己的版本（semver，独立演进；docs/plugins.md 规则 8；Nous_Extend 十五端点换归属 + 删静态表 15 行）
layer = "app"          # 必须 == docs/plugins.md 的 layer 列
crate = "nous-server"

[requires]                 # cargo metadata 里的内部 workspace 依赖
nous-ai = "^0.1"
nous-dispatcher = "^0.1"
nous-combos = "^0.1"
nous-routes = "^0.1"
nous-durable = "^0.1"
nous-extend = "^0.1"
nous-device = "^0.1"
nous-env = "^0.1"
nous-repo = "^0.1"
nous-elements = "^0.1"
nous-presets-admin = "^0.1"
nous-prompts = "^0.1"
nous-env-ssh = "^0.1"
element-models = "^0.1"
nous-skills = "^0.1"
nous-runtime = "^0.1"
nous-sessions = "^0.1"
data-data-manager = "^0.1"
data-archive = "^0.1"
nous-store = "^0.1"
nous-telemetry = "^0.1"
nous-tools = "^0.1"
nous-wire = "^0.1"

[provides]
capability = "server"
