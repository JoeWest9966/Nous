name = "combos"
vendor = "Nous"
version = "0.2.3"  # 插件自己的版本（semver，独立演进；docs/plugins.md 规则 8）
layer = "app"              # 必须 == docs/plugins.md 的 layer 列
crate = "nous-combos"

[requires]                 # cargo metadata 里的内部 workspace 依赖
nous-dispatcher = "^0.1"   # 试跑判定 evaluate（纯函数）
nous-durable = "^0.1"      # 起会话 + 写血缘（命令面）
nous-repo = "^0.1"         # sha256（内容版本号，与 git 面同一份）
nous-routes = "^0.1"       # 端点契约

[provides]
capability = "combos"
