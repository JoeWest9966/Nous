[package]
name = "nous-ai"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Unified multi-provider LLM types + streaming. 冻结自 pi-rust@v0.24.2 的 rpi-ai"
readme = "README.md"

[dependencies]
nous-telemetry = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
jsonschema = { workspace = true }
reqwest = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
eventsource-stream = { workspace = true, optional = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
base64 = { workspace = true }
regex = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[features]
default = []
# 真 HTTP provider（anthropic）。默认关，核心构建保持无网络。
providers = ["dep:reqwest", "dep:bytes", "dep:eventsource-stream"]
# 打真网络的 smoke 测试，运行时还要 ANTHROPIC_API_KEY 才跑。
smoke = ["providers"]
