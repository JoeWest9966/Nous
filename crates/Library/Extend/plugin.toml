name = "Library_Extend"
vendor = "Library"
version = "0.9.0"  # 插件自己的版本（semver，独立演进；docs/plugins.md 规则 8）
                   # 0.8.0 → 0.9.0：vendor / 目录 / 包名改名（身份变更 = minor）
layer = "app"          # 必须 == docs/plugins.md 的 layer 列
crate = "library-extend"

[requires]                 # cargo metadata 里的内部 workspace 依赖
nous-durable = "^0.1"
nous-ext-sdk = "^0.1"
nous-repo = "^0.1"
nous-routes = "^0.1"

[provides]
capability = "extend"
