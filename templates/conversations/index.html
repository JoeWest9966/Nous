<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>qrd3wh · 对话</title>
<style>
  :root {
    color-scheme: dark;
    --bg:#0e0f11; --fg:#e6e6e6; --dim:#7f858e; --line:#23262b;
    --panel:#121417; --sel:#1b2a20; --busy:#7ee787; --fork:#8ab4f8;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing:border-box; }
  body { margin:0; height:100dvh; display:flex; flex-direction:column;
         background:var(--bg); color:var(--fg); font:14px/1.6 ui-sans-serif,system-ui,-apple-system,sans-serif; }
  header { display:flex; align-items:center; gap:12px; padding:10px 16px; border-bottom:1px solid var(--line); }
  header b { font-size:15px; }
  header .meta { color:var(--dim); font-size:12px; font-variant-numeric:tabular-nums; }
  header .grow { flex:1; }
  button { background:#1d2126; color:var(--fg); border:1px solid var(--line); border-radius:7px;
           padding:5px 11px; font:inherit; font-size:13px; cursor:pointer; }
  button:hover { border-color:#3a4149; }
  button:disabled { opacity:.45; cursor:default; }

  .wrap { flex:1; display:flex; min-height:0; }

  /* ── 左：会话树 ── */
  aside { width:320px; border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
  aside .bar { padding:8px 10px; border-bottom:1px solid var(--line); display:flex; gap:8px; }
  aside .bar button { flex:1; }
  #tree { flex:1; overflow:auto; padding:8px 0; }
  .row { display:flex; align-items:baseline; gap:6px; padding:2px 10px 2px 0; cursor:pointer;
         font-family:var(--mono); font-size:12.5px; white-space:nowrap; }
  .row:hover { background:#15181b; }
  .row.sel { background:var(--sel); }
  .row .guides { color:#3a4048; white-space:pre; }
  .row .nm { color:var(--fg); overflow:hidden; text-overflow:ellipsis; }
  .row .nm.fork { color:#cfe3ff; }
  .row .dot { color:var(--busy); }
  .row .desc { color:var(--dim); font-size:11.5px; overflow:hidden; text-overflow:ellipsis; margin-left:6px; }
  .row.busy .nm { color:#d9ffe3; }
  .empty { color:var(--dim); padding:14px; font-size:12.5px; }

  /* ── 右：对话 ── */
  main { flex:1; display:flex; flex-direction:column; min-width:0; }
  #log { flex:1; overflow:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .m { border:1px solid var(--line); border-radius:10px; padding:8px 12px; white-space:pre-wrap; word-break:break-word; }
  .m.user { background:#14171a; }
  .m.assistant { background:#111315; }
  .m .who { display:block; color:var(--dim); font-size:11px; letter-spacing:.08em; text-transform:uppercase; margin-bottom:3px; }
  .m .forkbtn { float:right; opacity:0; font-size:11px; padding:1px 7px; }
  .m:hover .forkbtn { opacity:1; }
  .m.tool { border-style:dashed; color:var(--dim); font-family:var(--mono); font-size:12px; }
  form { display:flex; gap:8px; padding:10px 16px 16px; border-top:1px solid var(--line); }
  input[type=text] { flex:1; background:#16191c; color:var(--fg); border:1px solid var(--line);
                     border-radius:8px; padding:9px 12px; font:inherit; }
  input[type=text]:focus { outline:2px solid #2f6f3f; outline-offset:-1px; }
  .hint { color:var(--dim); font-size:12px; }
  .tag { font-size:11px; color:var(--dim); border:1px solid var(--line); border-radius:20px; padding:0 7px; }
  .tag.ro { color:#ffd28a; border-color:#4a3c22; }
</style>
</head>
<body>
<header>
  <b>qrd3wh</b>
  <span class="meta" id="model">…</span>
  <span class="grow"></span>
  <span class="tag" id="ro" hidden>只读</span>
  <button id="rotoggle" title="切到只读：不给模型会写的工具">只读</button>
  <span class="meta" id="state"></span>
</header>

<div class="wrap">
  <aside>
    <div class="bar">
      <button id="new">＋ 新对话</button>
      <button id="refresh" title="重新拉一次树">↻</button>
    </div>
    <div id="tree"><p class="empty">还没有对话。点「＋ 新对话」。</p></div>
  </aside>

  <main>
    <div id="log"><p class="empty">左边挑一个对话。</p></div>
    <form id="say">
      <input id="q" type="text" autocomplete="off" placeholder="说点什么…">
      <button id="go" type="submit">发送</button>
      <button id="stop" type="button">停</button>
    </form>
  </main>
</div>

<script type="module">
// 相对地址：宿主把 /p/<board>/<id>/ 反代进来。
const base = location.pathname.endsWith("/") ? location.pathname : location.pathname + "/";
const $ = (id) => document.getElementById(id);
const api = (p, init) => fetch(base + p, init).then(async (r) => {
  const body = await r.json().catch(() => null);
  if (!r.ok) throw new Error(body?.error ?? `HTTP ${r.status}`);
  return body;
});
const post = (p, body) => api(p, {
  method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body ?? {}),
});

let sessions = [];
let current = null;   // 选中的会话 id
let stream = null;    // 那个会话的 SSE

// ── 树 ──────────────────────────────────────────────────────────────────
// 引导线是画出来的，不是缩进堆出来的：深了也不会飘。
const renderTree = () => {
  const box = $("tree");
  if (!sessions.length) {
    box.innerHTML = '<p class="empty">还没有对话。点「＋ 新对话」。</p>';
    return;
  }
  const byId = new Map(sessions.map((s) => [s.id, s]));
  const kids = new Map();
  const roots = [];
  for (const s of sessions) {
    const parent = s.parent && byId.has(s.parent.id) ? s.parent.id : null;
    if (parent === null) roots.push(s);
    else kids.set(parent, [...(kids.get(parent) ?? []), s]);
  }
  for (const list of kids.values()) list.sort((a, b) => a.id - b.id);
  roots.sort((a, b) => a.id - b.id);

  const frag = document.createDocumentFragment();
  const walk = (node, prefix, last) => {
    const branch = last ? "└── " : "├── ";
    const row = document.createElement("div");
    row.className = "row" + (node.id === current ? " sel" : "") + (node.busy ? " busy" : "");
    row.dataset.id = node.id;
    row.title = `#${node.id}${node.busy ? " · " + node.busy : ""}`;

    const guides = document.createElement("span");
    guides.className = "guides";
    guides.textContent = prefix + branch;

    const name = document.createElement("span");
    name.className = "nm" + (node.parent ? " fork" : "");
    name.textContent = (node.busy ? "● " : "") + node.name;

    const desc = document.createElement("span");
    desc.className = "desc";
    desc.textContent = node.parent
      ? `从 #${node.parent.id} 分叉`
      : (node.last?.text ?? "").replace(/\s+/g, " ").slice(0, 26);

    row.append(guides, name, desc);
    row.onclick = () => select(node.id);
    row.ondblclick = async () => {
      const next = prompt("改个名字？", node.name);
      if (!next?.trim()) return;
      await post(`v1/sessions/${node.id}/rename`, { name: next.trim() });
      await refresh();
    };
    frag.append(row);

    const childPrefix = prefix + (last ? "    " : "│   ");
    const children = kids.get(node.id) ?? [];
    children.forEach((child, i) => walk(child, childPrefix, i === children.length - 1));
  };
  roots.forEach((root, i) => walk(root, "", i === roots.length - 1));
  box.replaceChildren(frag);
};

const refresh = async () => {
  try {
    const data = await api("v1/sessions");
    sessions = data.items;
    if (current === null && sessions.length) current = sessions[0].id;
    renderTree();
    const me = sessions.find((s) => s.id === current);
    $("ro").hidden = !me?.readOnly;
    if (me) $("model").textContent = me.model ?? "";
  } catch (error) {
    $("state").textContent = String(error.message ?? error);
  }
};

// ── 一个会话 ────────────────────────────────────────────────────────────
const roleOf = (kind) =>
  kind === "pi.user" ? "user" : kind === "pi.assistant" ? "assistant" : "tool";

const add = (role, text, entryId) => {
  const el = document.createElement("div");
  el.className = "m " + role;
  const who = document.createElement("span");
  who.className = "who";
  who.textContent = role === "user" ? "你" : role === "tool" ? "工具" : "agent";
  el.append(who, document.createTextNode(text));
  if (entryId != null) {
    // 分叉只挂在具体的一条上：从哪一句长出来的，就得指得清。
    const btn = document.createElement("button");
    btn.className = "forkbtn";
    btn.textContent = "从这条分叉";
    btn.onclick = async () => {
      const made = await post(`v1/sessions/${current}/fork`, { entryId });
      current = made.id;
      await refresh();
      await select(made.id);
    };
    el.append(btn);
  }
  $("log").append(el);
  el.scrollIntoView({ block: "end" });
  return el;
};

const select = async (id) => {
  current = id;
  renderTree();
  $("log").replaceChildren();
  $("state").textContent = "加载…";

  stream?.close();
  const data = await api(`v1/sessions/${id}/entries?limit=200`);
  for (const entry of [...data.items].reverse()) {
    const text = entry.text;
    if (!text) continue;
    add(roleOf(entry.kind), text, entry.id);
  }
  $("state").textContent = data.items.length ? "" : "空会话，说第一句吧";

  stream = new EventSource(base + `v1/sessions/${id}/events`);
  let live = null;
  stream.onmessage = (message) => {
    const event = JSON.parse(message.data);
    if (event.type === "snapshot") { live = null; return; }
    if (event.type === "message_start" && event.message?.role === "assistant") { live = null; return; }
    if (event.type === "message_update") {
      for (const change of event.changes ?? []) {
        if (change.type !== "text_delta") continue;
        live ??= add("assistant", "");
        live.lastChild.textContent += change.delta;
        live.scrollIntoView({ block: "end" });
      }
      return;
    }
    if (event.type === "message_end") { live = null; return; }
    if (event.type === "tool_execution_start") { live = null; add("tool", `${event.name}(${JSON.stringify(event.args ?? {})})`); return; }
    if (event.type === "run_end") { $("state").textContent = ""; refresh(); }
  };
  stream.onerror = () => { $("state").textContent = "断流了，正在重连…"; };
};

// ── 发话 ────────────────────────────────────────────────────────────────
$("say").onsubmit = async (event) => {
  event.preventDefault();
  const content = $("q").value.trim();
  if (!content || current === null) return;
  $("q").value = "";
  $("go").disabled = true;
  add("user", content);
  $("state").textContent = "想…";
  try {
    // requestId 让重发变成同一次提交，而不是第二次干活。
    await post(`v1/sessions/${current}/messages`, { content, requestId: crypto.randomUUID() });
  } catch (error) {
    add("tool", String(error.message ?? error));
  } finally {
    $("go").disabled = false;
  }
};

$("stop").onclick = () => current !== null && post(`v1/sessions/${current}/abort`).catch(() => {});
$("rotoggle").onclick = async () => {
  if (current === null) return;
  const me = sessions.find((s) => s.id === current);
  await post(`v1/sessions/${current}/config`, { readOnly: !me?.readOnly });
  await refresh();
};
$("refresh").onclick = () => refresh();
$("new").onclick = async () => {
  const name = prompt("新对话叫什么？", "新对话");
  if (name === null) return;
  const made = await post("v1/sessions", { name: name.trim() || "新对话" });
  await refresh();
  await select(made.id);
};

api("v1/device").then((d) => { $("model").textContent = `${d.model.provider}/${d.model.modelId}${d.faux ? " · 假" : ""}`; });
await refresh();
if (current !== null) await select(current);
// 树上的忙闲是派生量，轮询就够 —— 不值得为它再开一条流。
setInterval(refresh, 3000);
</script>
</body>
</html>
