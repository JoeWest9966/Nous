name: verify

# 编码仓的 CI。spec 不在本仓（`docs/spec/README.md` 只留指针）：
# spec 的唯一真相在同一个仓的 `spec/kernel-rust` 分支，这里 checkout 到 `spec/`，
# 让 `scripts/judge.sh` 的 EX 编号自检（EX-57）在 CI 上是**真判**，不是"两端都空"的假绿。

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo

      - uses: actions/checkout@v4
        with:
          ref: spec/kernel-rust
          path: spec

      - name: 把 spec 树指给 judge.sh
        run: echo "NOUS_SPEC=$GITHUB_WORKSPACE/spec" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable

      - name: cargo test --workspace
        working-directory: repo
        run: cargo test --workspace --quiet

      - name: EX 名单自检（EX-57；spec 缺失会打 SKIP 且没有 ids_equal=1 → 这里红）
        working-directory: repo
        run: ./scripts/judge.sh ex-id-set | grep -F 'ids_equal=1'

      # fixture 判据**不进 CI**：它读的是 j1900 上的真实会话库，`fixtures/*.sqlite` 在
      # .gitignore 里（真实用户数据永不入库），runner 上不可能有它。断言一个拿不到的文件
      # 必须存在 = 每次 CI 都红，红久了就没人看 CI。
      # 本地跑：NOUS_FIXTURE=fixtures/agent.sqlite ./scripts/verify.sh fixture
      # 让 CI 也能真跑的那份**脱敏** fixture 见 #43；#43 落地后在这里加回一步，指向它。

      - name: 边界判据（spec 第 1 章 15 条）
        working-directory: repo
        # 现在只剩判据 1 红（nous-app 还没接 tools/runtime，T5 接线）；7b 已由 #41 变绿。
        # 这里不挡流水线，但红/绿/数字都会打在日志里 —— 别加 continue-on-error 之后就没人看。
        continue-on-error: true
        run: ./scripts/verify.sh boundary

      - name: 摘要（红/绿/SKIP 各多少条）
        working-directory: repo
        run: ./scripts/verify.sh boundary 2>&1 | sed 's/\x1b\[[0-9;]*m//g' | tail -3
