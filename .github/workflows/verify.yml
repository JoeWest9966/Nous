name: verify

# 编码仓的 CI。spec 不在本仓（`docs/spec/README.md` 只留指针）：
# spec 的唯一真相在同一个仓的 `spec/kernel-rust` 分支，这里 checkout 到 `spec/`，
# 让 `scripts/judge.sh` 的 EX 编号自检（EX-57）在 CI 上是**真判**，不是"两端都空"的假绿。

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo

      - uses: actions/checkout@v4
        with:
          ref: spec/kernel-rust
          path: spec

      - name: 把 spec 树指给 judge.sh
        run: echo "NOUS_SPEC=$GITHUB_WORKSPACE/spec" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable

      - name: cargo test --workspace
        working-directory: repo
        run: cargo test --workspace --quiet

      - name: EX 名单自检（EX-57；spec 缺失会打 SKIP 且没有 ids_equal=1 → 这里红）
        working-directory: repo
        run: ./scripts/judge.sh ex-id-set | grep -F 'ids_equal=1'

      - name: fixture（进仓的脱敏小样本，#43）
        working-directory: repo
        # 读的是**进仓**的 `fixtures/agent.small.sqlite`（`scripts/make-small-fixture.py`
        # 从真库生成：字符串截断 200 字、usage/cost 归零、120 个会话）。真数据永不入库。
        # 缺了就打 error —— CI 上不许出现 SKIP，那等于这一步什么都没验。
        run: |
          test -f fixtures/agent.small.sqlite || {
            echo '::error::CI 缺少 fixtures/agent.small.sqlite（脱敏小样本，应当进仓）'; exit 1; }
          rc=0
          NOUS_FIXTURE=fixtures/agent.small.sqlite ./scripts/verify.sh fixture \
            > /tmp/nous-fixture-ci.log 2>&1 || rc=$?
          sed -r 's/\x1B\[[0-9;]*[mK]//g' /tmp/nous-fixture-ci.log
          [ "$rc" -eq 0 ] || { echo '::error::verify fixture 未通过'; exit "$rc"; }
          if grep -qF 'SKIP:' /tmp/nous-fixture-ci.log; then
            echo '::error::CI 中不允许 fixture SKIP'
            exit 1
          fi

      - name: 边界判据（spec 第 1 章 15 条）
        working-directory: repo
        # 现在只剩判据 1 红（nous-app 还没接 tools/runtime，T5 接线）；7b 已由 #41 变绿。
        # 这里不挡流水线，但红/绿/数字都会打在日志里 —— 别加 continue-on-error 之后就没人看。
        continue-on-error: true
        run: ./scripts/verify.sh boundary

      - name: 摘要（红/绿/SKIP 各多少条）
        working-directory: repo
        run: ./scripts/verify.sh boundary 2>&1 | sed 's/\x1b\[[0-9;]*m//g' | tail -3
