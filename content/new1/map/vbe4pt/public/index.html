<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>extend · Nous 扩展</title>
    <link rel="stylesheet" href="./style.css" />
    <script>
      // 宿主把这块挂在 /p/new1/vbe4pt（可能没有尾斜杠）。没有它，./style.css 会解析到上一层去。
      if (!location.pathname.endsWith("/")) {
        location.replace(location.pathname + "/" + location.search + location.hash);
      }
    </script>
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="3" width="7" height="7" rx="1.5" />
          <rect x="14" y="3" width="7" height="7" rx="1.5" />
          <rect x="3" y="14" width="7" height="7" rx="1.5" />
          <path d="M17.5 14v7M14 17.5h7" />
        </svg>
        <div class="titles">
          <h1>extend</h1>
          <p>new1<span class="sep">/</span>vbe4pt<span class="sep">·</span><span id="count">—</span></p>
        </div>
      </div>
      <div class="top-right">
        <span class="hint dim" id="repo">—</span>
        <button class="chip-status" id="refresh" title="重新问一遍">
          <span class="dot" data-state="wait"></span>刷新
        </button>
      </div>
    </header>

    <main>
      <p class="lede">
        这一页是<b>只读</b>的：扩展装在 qrd3wh 那个进程里（<code>registry.install()</code>），
        不落盘、没有安装位、不靠 <code>/reload</code>。所以下面每一样都是
        <b>问进程要的</b>，不是扫目录扫出来的 —— 仓库里写着什么，和这一刻装着什么，是两件事。
      </p>

      <section class="card" id="ours">
        <div class="card-head">
          <h2>我们开发的</h2>
          <span class="dim small">源码在 <code id="repo-path">—</code></span>
        </div>
        <ul class="exts" id="ours-list"></ul>
      </section>

      <section class="card muted" id="others">
        <div class="card-head">
          <h2>不归这一页管</h2>
          <span class="dim small">列出来只为让人知道它们存在，别以为是漏了</span>
        </div>
        <ul class="exts" id="others-list"></ul>
      </section>
    </main>

    <div class="toast" id="toast" hidden></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
