<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pxbgng · 对话列表</title>
<style>
  /* 这套皮照着 Pele 的 treeView 做：16px、28px 行距、1.5px 细描边图标、
     1px 圆角引导线、目录加粗。颜色取自它 playground 的深色实际输出（#1c1b1a 底）。 */
  :root {
    color-scheme: dark;
    --bg:#1c1b1a;          /* 画布底 */
    --fg:#cecdc3;          /* 标签 */
    --muted:#878580;       /* 图标、次要文字 */
    --faint:#5f5c58;       /* 更次要：id */
    --guide:#3f3d3a;       /* 引导线 */
    --surface:#272523;     /* hover / 选中底 */
    --accent:#5b7bd5;      /* 选中、正在跑 */
    --font: -apple-system, BlinkMacSystemFont, "Inter Variable", Inter, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  * { box-sizing:border-box; }
  body { margin:0; height:100dvh; display:flex; flex-direction:column;
         background:var(--bg); color:var(--fg); font:16px/1.4 var(--font); -webkit-font-smoothing:antialiased; }

  /* 栏跟它一样安静：没有按钮壳，只有字。 */
  .bar { display:flex; align-items:center; gap:10px; padding:14px 18px 10px; flex:none; }
  .brand { font-size:15px; color:var(--fg); }
  .count { font-size:13px; color:var(--faint); font-variant-numeric:tabular-nums; }
  .grow { flex:1; }
  .state { font-size:12.5px; color:#c08a7a; max-width:40ch; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .link { font:inherit; font-size:13px; color:var(--muted); background:none; border:0; padding:2px 4px;
          cursor:pointer; text-decoration:none; border-radius:5px; }
  .link:hover { color:var(--fg); background:var(--surface); }
  .link[hidden] { display:none; }

  #list { flex:1; overflow:auto; padding:6px 0 40px; scrollbar-gutter:stable both-edges; }
  #list > * { max-width:820px; margin:0 auto; }

  /* ── 一行 ──
     28px 行距、图标 16px、标签离图标 6px —— 全是 Pele 输出里的实际坐标。 */
  .row { position:relative; display:flex; align-items:center; gap:6px; height:28px;
         padding:0 16px 0 8px; cursor:pointer; border-radius:6px; }
  .row:hover { background:rgba(255,255,255,.028); }
  /* 选中不用灰底：跟着强调色走一点味道，才和 hover 区分得出来。 */
  .row.sel { background:rgba(91,123,213,.16); }
  .row.sel .nm { color:#f2f1ea; }
  .row.sel .ico { color:var(--accent); }
  .row:hover .ico { color:var(--fg); }
  .row.sel .ico { color:var(--accent); }

  .ico { flex:none; width:16px; height:16px; color:var(--muted); }
  .nm { flex:none; max-width:52%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
        font-size:16px; color:var(--fg); }
  .row.dir .nm { font-weight:600; }
  .tail { flex:1; min-width:0; font-size:13px; color:var(--faint);
          overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tail.live { color:var(--accent); }
  .tag { flex:none; font-size:11px; color:var(--faint); border:1px solid var(--guide);
         border-radius:99px; padding:0 6px; line-height:15px; }

  /* ── 引导线：1px，最后一个孩子那里拐个 4px 的圆角（跟 Pele 的 path 一模一样） ── */
  .guides { position:absolute; inset:0; pointer-events:none; }
  .guides i { position:absolute; background:var(--guide); }
  .guides i.v { width:1px; top:0; bottom:0; }
  .guides i.h { height:1px; width:8px; top:14px; }
  .guides i.elbow { top:0; height:14px; width:8px; background:none;
                    border-left:1px solid var(--guide); border-bottom:1px solid var(--guide);
                    border-bottom-left-radius:4px; }

  .note { color:var(--muted); font-size:14px; padding:24px 18px; }
  .note.err { color:#c08a7a; }
  .note code { font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:12.5px; color:var(--fg); }

  /* 窄屏：元信息先让位，名字留住。 */
  @media (max-width:620px) {
    .tail, .tag { display:none; }
    .nm { max-width:calc(100% - 40px); }
  }
</style>
</head>
<body>
<header class="bar">
  <span class="brand">对话</span>
  <span class="count" id="count"></span>
  <span class="grow"></span>
  <span class="state" id="state"></span>
  <a class="link" id="open" href="#" hidden>qrd3wh ↗</a>
  <button class="link" id="refresh" type="button" title="重新拉一次列表">刷新</button>
</header>

<main id="list" role="tree" aria-label="对话"></main>

<script type="module">
// 块之间只走 HTTP，地址只从宿主的 ctx / resolve 来 —— 这里一个 `/p/...` 都不拼。
const self = location.pathname.endsWith("/") ? location.pathname : location.pathname + "/";
const $ = (id) => document.getElementById(id);
const get = (url) => fetch(url).then(async (r) => {
  const body = await r.json().catch(() => null);
  if (!r.ok) throw new Error(body?.error ?? `HTTP ${r.status}`);
  return body;
});
const post = (url, body) => fetch(url, {
  method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body ?? {}),
}).then(async (r) => {
  const data = await r.json().catch(() => null);
  if (!r.ok) throw new Error(data?.error ?? `HTTP ${r.status}`);
  return data;
});

// 对面是谁：先是 id，id 认不出来就按名字找（换一盘也还能用）。
let tag = null;
try {
  const ctx = await get(self + "__nous/ctx");
  tag = ctx.blocks.find((b) => b.id === "qrd3wh")
     ?? ctx.blocks.find((b) => b.name === "session" && b.kind === "group")
     ?? null;
  if (!tag) throw new Error("这一盘里没有 qrd3wh，列表不知道去哪拿");
  $("open").href = tag.url;
  $("open").hidden = false;
} catch (error) {
  $("list").innerHTML = `<p class="note err">找不到对话那一边：<code>${String(error.message ?? error)}</code></p>`;
}

const api = (p) => get(tag.url + "/" + p);

let sessions = [];
let selected = null;   // 盘上选的那个 —— 这一页不自己发明选择，只显示和改写它
let selAt = -1;

// ── 图标：Pele 输出的那两个 24 格 path，原样搬过来（描边 1.5，颜色 currentColor） ──
const svg = (d) => {
  const node = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  node.setAttribute("class", "ico");
  node.setAttribute("viewBox", "0 0 24 24");
  node.setAttribute("fill", "none");
  node.setAttribute("stroke", "currentColor");
  node.setAttribute("stroke-width", "1.5");
  node.setAttribute("stroke-linecap", "round");
  node.setAttribute("stroke-linejoin", "round");
  const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
  path.setAttribute("d", d);
  node.append(path);
  return node;
};
// 折角文件 / 夹子 —— material-icon-theme 没装时它退化的就是这两个。
const FILE = "M6.5 3h7L19 8.5v11a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 5 19.5v-15A1.5 1.5 0 0 1 6.5 3zM13.5 3v5.5H19";
const DIR = "M3 6.5A1.5 1.5 0 0 1 4.5 5h4.6l2.4 2.5h8A1.5 1.5 0 0 1 21 9v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18z";

const render = () => {
  const box = $("list");
  const scroll = box.scrollTop;
  if (!sessions.length) {
    box.innerHTML = '<p class="note">还没有对话。去 qrd3wh 建一个。</p>';
    $("count").textContent = "";
    return;
  }

  // 父子按 id 排；「有分叉」的那个画成夹子（加粗），其余是文件。
  const byId = new Map(sessions.map((s) => [s.id, s]));
  const kids = new Map();
  const roots = [];
  for (const s of sessions) {
    const parent = s.parent && byId.has(s.parent.id) ? s.parent.id : null;
    if (parent === null) roots.push(s);
    else kids.set(parent, [...(kids.get(parent) ?? []), s]);
  }
  for (const list of kids.values()) list.sort((a, b) => a.id - b.id);
  roots.sort((a, b) => a.id - b.id);

  // 每层缩进 20px，图标落在 8 + d*20；引导线在 15 + 20k（图标左边缘 +7）。
  const INDENT = 20;
  const ICON = 8;
  const LINE = 7;
  const frag = document.createDocumentFragment();

  /** `lasts`：这条路径上每一层「我是不是最小的那个」——决定竖线是拐弯还是穿过去。 */
  const walk = (node, depth, lasts) => {
    const row = document.createElement("div");
    row.className = "row" + (node.id === selected ? " sel" : "") + ((kids.get(node.id)?.length ?? 0) ? " dir" : "");
    row.dataset.id = node.id;
    row.setAttribute("role", "treeitem");
    row.setAttribute("aria-selected", String(node.id === selected));
    row.style.paddingLeft = `${ICON + depth * INDENT}px`;
    row.title = `#${node.id}${node.busy ? " · " + node.busy : ""}${node.model ? " · " + node.model : ""}`;
    row.onclick = () => pick(node.id);
    row.ondblclick = () => pick(node.id, true);

    const guides = document.createElement("span");
    guides.className = "guides";
    // 第 level 层那根竖线要不要穿过这一行，看的是「我在那一层的祖先是不是最小的孩子」——
    // 也就是 lasts[level + 1]，不是 lasts[level]。
    for (let level = 0; level <= depth - 2; level++) {
      if (lasts[level + 1]) continue;
      const v = document.createElement("i");
      v.className = "v";
      v.style.left = `${ICON + level * INDENT + LINE}px`;
      guides.append(v);
    }
    if (depth > 0) {
      const x = ICON + (depth - 1) * INDENT + LINE;
      if (lasts[depth]) {
        const elbow = document.createElement("i");
        elbow.className = "elbow";
        elbow.style.left = `${x}px`;
        guides.append(elbow);
      } else {
        const v = document.createElement("i");
        v.className = "v";
        v.style.left = `${x}px`;
        const h = document.createElement("i");
        h.className = "h";
        h.style.left = `${x}px`;
        guides.append(v, h);
      }
    }

    row.append(guides, svg(kids.get(node.id)?.length ? DIR : FILE));

    const name = document.createElement("span");
    name.className = "nm";
    name.textContent = node.name;
    row.append(name);

    const tail = document.createElement("span");
    tail.className = "tail" + (node.busy ? " live" : "");
    tail.textContent = node.busy
      ? (node.busy === "queued" ? "排队中" : "运行中")
      : node.parent
        ? `← #${node.parent.id} 分叉`
        : (node.last?.text ?? "").replace(/\s+/g, " ").slice(0, 72) || "空会话";
    row.append(tail);

    if (node.machine) {
      const tagEl = document.createElement("span");
      tagEl.className = "tag";
      tagEl.textContent = node.machine;
      tagEl.title = `跑在 ${node.machine}`;
      row.append(tagEl);
    }

    if (node.readOnly) {
      const tagEl = document.createElement("span");
      tagEl.className = "tag";
      tagEl.textContent = "只读";
      row.append(tagEl);
    }

    // 血缘：这条会话是哪个终极模板 fire 出来的（`origin` 由引擎的 /v1/sessions 带来）。
    if (node.origin) {
      const tagEl = document.createElement("span");
      tagEl.className = "tag";
      tagEl.textContent = `▶ ${node.origin.ultimate}`;
      const when = node.origin.at ? ` · ${new Date(node.origin.at).toLocaleString()}` : "";
      tagEl.title = `${node.origin.trigger ?? "?"} · ${node.origin.forced ? "手动" : "自动"}${when}`;
      row.append(tagEl);
    }
    frag.append(row);

    const children = kids.get(node.id) ?? [];
    children.forEach((child, i) => walk(child, depth + 1, [...lasts, i === children.length - 1]));
  };
  roots.forEach((root, i) => walk(root, 0, [i === roots.length - 1]));

  box.replaceChildren(frag);
  box.scrollTop = scroll;
  $("count").textContent = `${sessions.length} 个`;
};

// 选中 = 改盘上那一个值。qrd3wh 的页面 1.2 秒内自己跟过来，不用这一页替它做任何事。
const pick = async (id, force = false) => {
  if (id === selected && !force) return;
  selected = id;
  render();
  try {
    const saved = await post(tag.url + "/v1/selection", { id });
    selAt = saved.at;
    $("state").textContent = "";
    // 双击顺手把对面打开 —— 列表挑完总得看内容。
    if (force) window.open(tag.url, "_blank", "noopener");
  } catch (error) {
    $("state").textContent = `没选上：${error.message ?? error}`;
  }
};

const loadSessions = async () => {
  try {
    sessions = (await api("v1/sessions")).items;
    render();
  } catch (error) {
    $("state").textContent = `拉不到列表：${error.message ?? error}`;
  }
};

const loadSelection = async () => {
  try {
    const saved = await api("v1/selection");
    if (saved.at === selAt) return;
    selAt = saved.at;
    if (saved.id === selected) return;
    selected = saved.id;
    render();
  } catch {}
};

if (tag) {
  $("refresh").onclick = () => { loadSessions(); loadSelection(); };
  // 上下键换人：这页只有一件事，键盘不该只是装饰。
  addEventListener("keydown", (event) => {
    if (event.key !== "ArrowDown" && event.key !== "ArrowUp") return;
    event.preventDefault();
    const index = sessions.findIndex((s) => s.id === selected);
    const next = sessions[Math.min(Math.max(index + (event.key === "ArrowDown" ? 1 : -1), 0), sessions.length - 1)];
    if (next) pick(next.id);
  });

  await loadSessions();
  await loadSelection();
  // 忙闲和最后一句都是派生量：轮询就够，不值得为它开一条流。
  setInterval(loadSessions, 3000);
  setInterval(loadSelection, 1200);
}
</script>
</body>
</html>
