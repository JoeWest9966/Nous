<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>hb7k3j · 新对话</title>
<style>
  /* pele 的 dark 主题（Flexoki）—— 和 https://pele.run/examples/cynefin 同一套 */
  :root {
    color-scheme: dark;
    --bg:#100f0f;          /* --ink，图的底色 */
    --panel:#1c1b1a;       /* --pele-bg：节点填充 */
    --surface:#282726;     /* --pele-surface */
    --surface-2:#343331;   /* --pele-surface-alt */
    --border:#403e3c;      /* --pele-border：节点和边界 */
    --line:#cecdc3;        /* --pele-line：cliff / 正文 */
    --fg:#cecdc3;          /* --pele-fg */
    --muted:#878580;       /* --pele-muted */
    --faint:#575653;
    --accent:#4385be;      /* --pele-accent */
    --s1:#d14d41; --s2:#da702c; --s3:#d0a215; --s4:#879a39; --s5:#3aa99f;
    --font: -apple-system, BlinkMacSystemFont, "Inter Variable", Inter, "Segoe UI", Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "Cascadia Code", "IBM Plex Mono", "Roboto Mono", "DejaVu Sans Mono", "Liberation Mono", Menlo, Monaco, "Consolas", "Source Code Pro", monospace;
    --radius: 6px;
    --ease: cubic-bezier(0.32, 0.72, 0, 1);
  }
  * { box-sizing:border-box; scrollbar-width:none; }
  ::-webkit-scrollbar { display:none; }
  html, body { height:100%; overflow:hidden; }     /* 一屏，永不滚动 */
  body { margin:0; background:var(--bg); color:var(--fg); font-family:var(--font);
         font-size:clamp(12px,1.75vmin,16px); line-height:1.5;
         display:grid; grid-template-rows:auto 1fr; }

  /* ── 顶栏：一行，标题居中，像图上方那行 title ── */
  header { position:relative; display:flex; align-items:center; justify-content:center;
           padding:1.6vmin 2.4vmin 1vmin; }
  header b { font-size:clamp(13px,1.9vmin,17px); font-weight:700; letter-spacing:-0.01em; }
  header .aside { position:absolute; right:2.4vmin; display:flex; align-items:center; gap:1.4vmin; }
  header .meta { color:var(--muted); font-size:clamp(10px,1.35vmin,12.5px); }
  a { color:var(--muted); text-decoration:none; font-size:clamp(10px,1.35vmin,12.5px); }
  a:hover { color:var(--line); }

  main { min-height:0; padding:0 1.6vmin 1.6vmin; }
  /* demo 的 figure 背景就是 --panel（#1c1b1a），域色叠加它上面才读得出那层淡色 */
  .board { position:relative; width:100%; height:100%; background:var(--panel); container-type:size; }

  /* 图本身：原路径，拉伸填满，线和虚线保持像素级不随拉伸变形 */
  svg.frame { position:absolute; inset:0; width:100%; height:100%; display:block; z-index:0; }
  svg.frame .b { fill:none; stroke:var(--border); stroke-dasharray:6 3; stroke-width:1; vector-effect:non-scaling-stroke; }
  svg.frame .cliff { fill:none; stroke:var(--line); stroke-width:2; stroke-linecap:round; vector-effect:non-scaling-stroke; }

  /* ── 四域：内容居中排在域里，跟 demo 的标题/副标题/节点一个节奏 ── */
  .region { position:absolute; z-index:1; display:flex; flex-direction:column; align-items:center;
            text-align:center; gap:0; padding:9% 6% 4%; }
  .r1 { left:0;    top:0;    width:50%; height:50%; }
  .r2 { left:50%;  top:0;    width:50%; height:50%; }
  .r4 { left:0;    top:50%;  width:50%; height:50%; }
  .r3 { left:50%;  top:50%;  width:50%; height:50%; }

  .region h2 { margin:0; font-size:clamp(12px,1.85vmin,17px); font-weight:700; letter-spacing:-0.01em; }
  .region .sub { margin:0; color:var(--muted); font-size:clamp(10px,1.5vmin,13px); font-style:italic; line-height:1.45; }
  .region .nodes { margin-top:1.8vmin; display:flex; flex-direction:column; align-items:center; gap:1vmin; max-width:100%; }

  /* 节点 = pele 的 node：面板底、1px 边框、6px 圆角 */
  .node { display:inline-flex; align-items:center; gap:.7em; max-width:100%;
          background:var(--panel); color:var(--fg); border:1px solid var(--border);
          border-radius:var(--radius); padding:.42em .95em; cursor:pointer;
          font-family:var(--mono); font-size:clamp(10px,1.55vmin,14px); line-height:1.4;
          transition:border-color .12s ease, background .12s ease, transform .1s ease-out; }
  .node:hover { border-color:var(--faint); }
  .node:active { transform:scale(.985); }          /* 按下即响应 */
  .node .id { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .node .tag { font-family:var(--font); font-size:.82em; color:var(--muted); flex:none; }
  .node.cta { font-family:var(--font); font-size:clamp(11px,1.6vmin,14.5px); padding:.5em 1.6em; }
  .node.cta:hover { border-color:var(--line); background:var(--surface); }
  .node[disabled] { opacity:.45; cursor:default; transform:none; }

  /* ── 中央 confusion 椭圆 ── */
  .hub { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); z-index:2;
         width:clamp(250px, 32%, 620px); height:clamp(170px, 27%, 330px);
         border-radius:50%; background:var(--panel); border:1px dashed var(--border);
         display:flex; flex-direction:column; align-items:center; justify-content:center;
         gap:.7vmin; text-align:center; padding:3% 9%; }
  .hub::before { content:""; position:absolute; inset:0; border-radius:50%; z-index:-1;
                 background:var(--s5); opacity:.18; }
  .hub h1 { margin:0; font-size:clamp(12px,1.85vmin,17px); font-weight:700; letter-spacing:-0.01em; }
  .hub .sub { margin:-.2vmin 0 .6vmin; color:var(--muted); font-size:clamp(9px,1.4vmin,12.5px); font-style:italic; }
  .hub input { width:100%; max-width:34vmin; background:var(--panel); color:var(--fg);
               border:1px solid var(--border); border-radius:var(--radius);
               padding:.45em 1em; font-family:var(--font); font-size:clamp(11px,1.5vmin,13.5px);
               text-align:center; outline:none; }
  .hub input:focus { border-color:var(--faint); }
  .hub input::placeholder { color:var(--faint); }
  #flash { color:var(--s4); font-size:clamp(9px,1.35vmin,12px); min-height:1.3em; font-family:var(--mono); }
  #errbox { position:fixed; left:50%; bottom:2vmin; transform:translateX(-50%); z-index:6; max-width:92vw; }
  .err { color:#efb7b3; background:#241718; border:1px solid #5a2a2a; border-radius:8px;
         padding:.7em 1.1em; font-size:clamp(10px,1.4vmin,12.5px); }

  /* ── 弹窗（苹果那套材料/压暗/从触发点长出）── 配色跟盘面同源 ── */
  .scrim { position:fixed; inset:0; z-index:10; display:flex; align-items:center; justify-content:center;
           background:rgba(16,15,15,.55); backdrop-filter:blur(2px);
           opacity:0; transition:opacity .28s var(--ease); }
  .scrim[hidden] { display:none; }
  .scrim.on { opacity:1; }
  .sheet { width:min(720px, 94vw); max-height:min(78dvh, 680px); display:flex; flex-direction:column;
           background:color-mix(in srgb, var(--panel) 82%, transparent);
           backdrop-filter:blur(24px) saturate(160%);
           border:1px solid var(--border); border-top-color:var(--faint);
           border-radius:14px; box-shadow:0 24px 60px -12px rgba(0,0,0,.75);
           transform:scale(.93) translateY(10px); opacity:0;
           transition:transform .32s var(--ease), opacity .28s var(--ease); overflow:hidden; }
  .scrim.on .sheet { transform:none; opacity:1; }
  .sheet > .shead { display:flex; align-items:center; gap:1vmin; padding:1.6vmin 1.8vmin 1.2vmin;
                    border-bottom:1px solid var(--border); }
  .sheet > .shead b { font-size:clamp(12px,1.7vmin,15px); font-weight:700; }
  .sheet input { flex:1; min-width:0; background:var(--surface); color:var(--fg);
                 border:1px solid transparent; border-radius:var(--radius); padding:.42em .9em;
                 font-family:var(--font); font-size:clamp(11px,1.5vmin,13px); outline:none; }
  .sheet input:focus { border-color:var(--border); }
  .sheet input::placeholder { color:var(--faint); }
  /* ── 弹窗正文：三列铁路图（pele railroad 的语法重绘）──
     供应商 │ 模型 │ 思考，每列每行一支药丸（choice 分支），同一个 drawRule 画的；
     高度 = 最长一列的行数 × PITCH —— 每行一支，不折行不扎堆。
     窄到装不下时列会摞成行（同一个 drawRule 换个位置），不是另一套版面。 */
  .diagram { flex:1; min-height:0; overflow-y:auto; padding:1vmin 1vmin .4vmin; overscroll-behavior:contain; }
  .diagram svg { display:block; width:100%; margin:0 auto; height:auto; }
  .diagram .rule > text { fill:var(--fg); }
  .diagram path { fill:none; stroke:var(--muted); stroke-width:1.2; }
  .diagram circle { fill:var(--muted); }
  .pill { cursor:pointer; outline:none; }
  .pill rect { fill:var(--surface); stroke:var(--border); stroke-width:1;
               transition:stroke .12s ease, fill .12s ease; }
  .pill:hover rect { stroke:var(--faint); }
  .pill:focus-visible rect { stroke:var(--accent); }
  .pill text { fill:var(--fg); }
  .pill.sel rect { stroke:var(--accent); fill:color-mix(in srgb, var(--accent) 16%, var(--surface)); }
  .pill.cur rect { stroke:var(--accent); }
  .pill.pv:hover rect { stroke:var(--accent); fill:color-mix(in srgb, var(--accent) 8%, var(--surface)); }
  /* 键盘焦点：跟 hover 得看得出不一样（hover 是描边变淡底，键盘是粗描边 + 一圈光），
     否则“我刚按到哪儿了”在暗底上根本分辨不出来。 */
  .pill.kb rect { stroke:var(--accent); stroke-width:2;
                  filter:drop-shadow(0 0 6px color-mix(in srgb, var(--accent) 55%, transparent)); }
  .pill:focus { outline:none; }
  .pill.sel text { font-weight:700; }
  .pill.dim rect { opacity:.45; }
  .dfoot { flex:none; color:var(--muted); font-family:var(--mono); font-size:clamp(9px,1.25vmin,11px);
           padding:.5vmin 1.8vmin 1.1vmin; border-top:1px solid var(--border); }
  .dfoot .demo { color:var(--s4); }
  .mnone { color:var(--muted); font-size:clamp(10px,1.4vmin,12.5px); padding:2.4vmin 1.2vmin; text-align:center; }

  @media (max-width:640px) { .hub input, .sheet input { font-size:16px; } .sheet { width:96vw; } }  /* iOS 不缩放 */
  /* 竖屏：椭圆收小，域的标题往外侧推，谁也不盖谁 */
  @media (orientation:portrait) {
    .region { padding:6% 3%; }
    .r1, .r2 { justify-content:flex-start; padding-top:9%; }
    .r4, .r3 { justify-content:flex-end; padding-bottom:9%; }
    .hub { width:min(84%, 320px); height:clamp(148px, 24vh, 230px); padding:0 8%; gap:.4vmin; }
    .hub input { max-width:none; width:100%; }
    .hub .sub { margin-bottom:.4vmin; }
  }
  @media (prefers-reduced-motion: reduce) {
    .scrim, .sheet, .pill rect, .node { transition:opacity .2s ease !important; }
    .sheet { transform:none !important; }
    .node:active, .pill:active rect { transform:none; }
  }
  @media (prefers-reduced-transparency: reduce) { .sheet { background:var(--panel); backdrop-filter:none; } }
  @media (prefers-contrast: more) { .sheet { background:var(--panel); border-color:var(--line); } }
</style>
</head>

<main>
  <div class="board">
    <!-- pele 的 cynefin 原路径，平移到 viewBox 0 0 640 440 -->
    <svg class="frame" viewBox="0 0 640 440" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0,0L314.04,0C315.06,27.5,322.13,27.5,323.15,55C315.14,82.5,335.41,82.5,327.39,110C328.99,137.5,322.51,137.5,324.11,165C319.92,192.5,324.19,192.5,320,220C280,225.07,280,210.71,240,215.78C200,204.86,200,227.13,160,216.22C120,223.83,120,218.6,80,226.21C40,222.27,40,221.52,0,217.58Z" fill="var(--s1)" fill-opacity="0.14"/>
      <path d="M314.04,0L640,0L640,222.23C600,231.87,600,212.95,560,222.59C520,213.69,520,227.54,480,218.63C440,224.66,440,213.77,400,219.8C360,218.1,360,221.69,320,220C324.19,192.5,319.92,192.5,324.11,165C322.51,137.5,328.99,137.5,327.39,110C335.41,82.5,315.14,82.5,323.15,55C322.13,27.5,315.06,27.5,314.04,0Z" fill="var(--s2)" fill-opacity="0.14"/>
      <path d="M0,217.58C40,221.52,40,222.27,80,226.21C120,218.6,120,223.83,160,216.22C200,227.13,200,204.86,240,215.78C280,210.71,280,225.07,320,220C339.2,264,291.2,341,329.6,385C300.8,407,325.76,429,320,440L0,440Z" fill="var(--s4)" fill-opacity="0.14"/>
      <path d="M320,220C360,221.69,360,218.1,400,219.8C440,213.77,440,224.66,480,218.63C520,227.54,520,213.69,560,222.59C600,212.95,600,231.87,640,222.23L640,440L320,440C325.76,429,300.8,407,329.6,385C291.2,341,339.2,264,320,220Z" fill="var(--s3)" fill-opacity="0.14"/>

        <path d="M0,217.58C40,221.52,40,222.27,80,226.21C120,218.6,120,223.83,160,216.22C200,227.13,200,204.86,240,215.78C280,210.71,280,225.07,320,220"/>

<script type="module">
// 块之间只走 HTTP，地址只从宿主的 ctx 来 —— 这里一个 /p/... 都不拼。
const self = location.pathname.endsWith("/") ? location.pathname : location.pathname + "/";
const $ = (id) => document.getElementById(id);
const get = (url) => fetch(url).then(async (r) => {
  const body = await r.json().catch(() => null);
  if (!r.ok) throw new Error(body?.error ?? `HTTP ${r.status}`);
  return body;
});
const post = (url, body) => fetch(url, {
  method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body ?? {}),
}).then(async (r) => {
  const data = await r.json().catch(() => null);
  if (!r.ok) throw new Error(data?.error ?? `HTTP ${r.status}`);
  return data;
});

let tag = null;
try {
  const ctx = await get(self + "__nous/ctx");
  tag = ctx.blocks.find((b) => b.id === "qrd3wh")
     ?? ctx.blocks.find((b) => b.name === "session" && b.kind === "group")
     ?? null;
  if (!tag) throw new Error("这一盘里没有 qrd3wh，创建不知道往哪发");
  $("open").href = tag.url;
  $("open").hidden = false;
} catch (error) {
  $("errbox").innerHTML = `<div class="err">找不到对话那一边：${String(error.message ?? error)}</div>`;
}

const api = (p) => get(tag.url + "/" + p);
let models = [];
let defaultModel = null;
let picked = null;
const fmt = (m) => `${m.provider}/${m.modelId}`;
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

// ── 弹窗开合：从触发点长出，Esc / 点 scrim 原路收回 ──
const openSheet = (from) => {
  const scrim = $("scrim");
  if (from && !reduceMotion) {
    const r = from.getBoundingClientRect();
    scrim.querySelector(".sheet").style.transformOrigin = `${r.left + r.width / 2}px ${r.top + r.height / 2}px`;
  }
  scrim.hidden = false;
  requestAnimationFrame(() => scrim.classList.add("on"));
  $("q").value = "";
  kb = { on: false, col: 0, row: 0 };
  renderDiagram();
  $("q").focus();
};
const closeSheet = () => {
  const scrim = $("scrim");
  scrim.classList.remove("on");
  setTimeout(() => { scrim.hidden = true; }, reduceMotion ? 200 : 320);   // 原路返回
};
$("choose").onclick = (e) => openSheet(e.currentTarget);
$("scrim").onclick = (e) => { if (e.target === $("scrim")) closeSheet(); };

// ── 弹窗内容：铁路图（pele.run/examples/railroad 的语法重绘）──
//   一列一条规则，每行一支药丸（choice 分支纵向排）：
//     「供应商」→「当前供应商 · 模型」→「思考」（只对支持思考的模型出）
//   搜索时模型列跨供应商出「匹配」，供应商列整列压暗。
//   宽度够就三列并排，不够就降成「两列 + 思考另起一行」，再窄就三段竖着摞 ——
//   不是三套版面，是同一个 drawRule 换了位置。
// 轨道/弧线/起终点圆点照抄 pele 的几何：首行在主轨道，其余行汇入左右两根锚定竖线。
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const pillW = (t) => {
  let w = 0;
  for (const ch of String(t)) w += ch.charCodeAt(0) > 0x2e7f ? 13 : 7.8;   // 13px mono 的步进
  return Math.max(34, Math.ceil(w) + 22);
};
const PH = 30, R = 10, PITCH = 40, GAP = 8;
/** 列间距：每列两头各有一个 r4 圆点（±16），40 让它们既不重叠也不显得两列无关。 */
const COLGAP = 40;
/**
 * 七个档位的全名，顺序照抄 pi-ai 的 `ModelThinkingLevelSchema`
 * （`@earendil-works/pi-ai/dist/providers/model-schema.d.ts:8`）。
 * 顺序就是“从少想到多想”，服务端夹档位也是按这个顺序往上找 —— 两边一致，
 * 面板上看到的就是库里会落的值。
 */
const LEVELS = ["off", "minimal", "low", "medium", "high", "xhigh", "max"];
let pickProvider = null;      // 模型列当前展开哪个供应商
/** 当前选的思考档。缺省 "off" —— 跟 pi-durable 的 `state?.thinkingLevel ?? "off"` 对齐，
    面板一开始就不撒谎：不填就是不思考，不是“不知道”。*/
let thinking = "off";

/** 当前模型支持哪几档。非 reasoning 模型这里就是 ["off"]，长度 1=不出思考列。 */
const levelsOfPick = () => {
  const m = picked && models.find((x) => x.provider === picked.provider && x.modelId === picked.modelId);
  return m?.thinkingLevels ?? ["off"];
};

/**
 * 把档位夹进 `levels`。跟 pi-ai 的 `clampThinkingLevel` 逐字同序（先往上找、再往下找），
 * 因为这一份只在模型换了的时候用；真落盘的是服务端那一夹，两边不一致就会出现
 * “面板显示 A、存进去是 B”。同序就不可能出现。
 */
const clampLevel = (level, levels) => {
  if (levels.includes(level)) return level;
  const at = LEVELS.indexOf(level);
  if (at === -1) return levels[0] ?? "off";
  for (let i = at; i < LEVELS.length; i++) if (levels.includes(LEVELS[i])) return LEVELS[i];
  for (let i = at - 1; i >= 0; i--) if (levels.includes(LEVELS[i])) return LEVELS[i];
  return levels[0] ?? "off";
};

/**
 * 一条规则 —— 铁路图的原子单位。`top` 是规则名基线，返回它占了几行。
 *
 * 自己在内部算 `ty`（轨道 y），所以调用方可以把它摆在任何位置：
 * 并排时三列传同一个 `top`，竖着摞时依次往下推。
 */
const drawRule = (name, items, cx0, cx1, top) => {
  const ty = top + 24;                          // 轨道在规则名下方 24px
  const ws = items.map((it) => {
    const isProvider = !!it.isProvider;
    const isLevel = !!it.isLevel;
    const sel = isLevel
      ? thinking === it.m.modelId
      : isProvider
        ? picked?.provider === it.m.provider && !$("q").value.trim()
        : !!picked && picked.provider === it.m.provider && picked.modelId === it.m.modelId;
    const isDef = !isProvider && !isLevel && !!defaultModel && defaultModel.provider === it.m.provider && defaultModel.modelId === it.m.modelId;
    return { ...it, isProvider, isLevel, sel, isDef, w: pillW(it.m.modelId) + (sel ? 18 : 0) + (isDef ? 32 : 0) };
  });
  const rows = ws.map((p, i) => ({ ...p, x: cx0 + 16, y: ty + i * PITCH }));   // 列内左对齐 —— 一列清单，不是扎堆
  const n = rows.length;
  // 进线 + 出线：两根短轨接到起终点圆点。每列都一样，所以不用区分“是不是最后一列”。
  let d = `M${cx0 - 16},${ty}H${cx0}M${cx1},${ty}H${cx1 + 16}`;
  if (n === 1) {
    d += `M${cx0},${ty}H${rows[0].x}M${rows[0].x + rows[0].w},${ty}H${cx1}`;
  } else {
    const first = rows[0], last = rows[n - 1];
    const xR = cx1 - 2 * R;                            // 右竖线的 x：锚死，不跟药丸走
    d += `M${cx0},${ty}H${first.x}M${first.x + first.w},${ty}H${cx1}`;   // 首行在主轨道上
    d += `M${cx0},${ty}a${R},${R} 0 0 1 ${R},${R}V${last.y - R}a${R},${R} 0 0 0 ${R},${R}H${last.x}`;   // 左竖线，喂给每一行
    d += `M${last.x + last.w},${last.y}H${xR - R}a${R},${R} 0 0 0 ${R},${-R}V${ty + R}a${R},${R} 0 0 1 ${R},${-R}`; // 右竖线，收回主轨道
    for (const r of rows.slice(1, -1)) {                              // 中间行：左右各一条弧搭上竖线
      d += `M${cx0 + R},${r.y - R}a${R},${R} 0 0 0 ${R},${R}H${r.x}`;
      d += `M${r.x + r.w},${r.y}H${xR - R}a${R},${R} 0 0 0 ${R},${-R}`;
    }
  }
  const pills = rows.map((p) => {
    const spans = [];
    if (p.sel) spans.push('<tspan fill="var(--accent)">✓ </tspan>');
    spans.push(esc(p.m.modelId));
    if (p.isDef) spans.push('<tspan fill="var(--s4)" font-size="10"> ·默认</tspan>');
    const cls = `pill${p.sel ? " sel" : ""}${p.isProvider && pickProvider === p.m.provider ? " cur" : ""}`
      + `${p.isProvider ? " pv" : ""}${p.isLevel ? " lv" : ""}${p.dim ? " dim" : ""}`;
    const label = p.isLevel ? `思考档位 ${p.m.modelId}`
      : p.isProvider ? `${p.m.provider}（切换）`
      : `${p.m.provider} / ${p.m.modelId}`;
    return `<g class="${cls}" data-p="${esc(p.m.provider)}" data-m="${esc(p.m.modelId)}" role="button" tabindex="0" aria-label="${esc(label)}"><rect x="${p.x}" y="${p.y}" width="${p.w}" height="${PH}" rx="${PH / 2}"/><text x="${p.x + p.w / 2}" y="${p.y + PH / 2 + 4.5}" text-anchor="middle" style="font-family:var(--mono)" font-size="13">${spans.join("")}</text></g>`;
  }).join("");
  body += `<g class="rule"><text x="${cx0}" y="${top + 4}" font-size="14" font-weight="700" text-anchor="start">${esc(name)}</text><path d="${d}"/><circle cx="${cx0 - 16}" cy="${ty}" r="4"/><circle cx="${cx1 + 16}" cy="${ty}" r="4"/>${pills}</g>`;
  return n;
};

let body = "";   // drawRule 往里追加 <g>，所以只能在 renderDiagram 里重置

const renderDiagram = () => {
  const box = $("diagram");
  if (!models.length) { box.innerHTML = '<div class="mnone">这台机器还没有能用的模型。</div>'; return; }
  const q = $("q").value.trim().toLowerCase();
  const hit = (m) => !q || `${m.provider} ${m.modelId} ${m.name ?? ""}`.toLowerCase().includes(q);

  const byProvider = new Map();
  for (const m of models) {
    if (!byProvider.has(m.provider)) byProvider.set(m.provider, []);
    byProvider.get(m.provider).push(m);
  }
  const provs = [...byProvider.keys()];
  if (!provs.includes(pickProvider)) pickProvider = picked?.provider ?? provs[0];

  let left, right, rightName;
  if (q) {
    left = provs.map((p) => ({ m: { modelId: p, provider: p }, isProvider: true, dim: true }));
    right = models.filter(hit).map((m) => ({ m }));
    rightName = "匹配";
    if (!right.length) { box.innerHTML = '<div class="mnone">没有匹配的模型。</div>'; return; }
  } else {
    left = provs.map((p) => ({ m: { modelId: p, provider: p }, isProvider: true }));
    right = (byProvider.get(pickProvider) ?? []).map((m) => ({ m }));
    rightName = `${pickProvider} · 模型`;
  }

  // 思考列只在模型真有得选的时候出（["off"] 一个档不占地方）。
  const levels = levelsOfPick();
  const cols = [{ name: "供应商", items: left }, { name: rightName, items: right }];
  if (levels.length > 1) {
    cols.push({ name: "思考", items: levels.map((l) => ({ m: { modelId: l, provider: "" }, isLevel: true })) });
  }

  const W = Math.min(720, Math.max(360, box.clientWidth || 560));
  const x0 = 28, xE = W - 28, avail = xE - x0;
  const widthOf = (c) => Math.max(...c.items.map((it) => pillW(it.m.modelId))) + 16;

  body = "";
  let height;
  const widest = (a) => a.reduce((s, c) => s + widthOf(c), 0);

  if (widest(cols) + COLGAP * (cols.length - 1) <= avail) {
    // 三列（或两列）并排：列间距 64，两个圆点各有地方待
    let cx = x0;
    let rows = 1;
    for (const c of cols) {
      const w = widthOf(c);
      rows = Math.max(rows, drawRule(c.name, c.items, cx, cx + w, 22));
      cx += w + COLGAP;
    }
    height = 22 + 24 + (rows - 1) * PITCH + PH + 16;
  } else {
    // 装不下就摞：先并排能塞的，剩下的各占一整行 —— 宽屏不变、窄屏自动长高
    let top = 22;
    const pairs = [];
    let cx = x0, used = 0, pair = [];
    for (const c of cols) {
      const w = widthOf(c);
      const add = pair.length ? COLGAP + w : w;
      if (pair.length && used + add > avail) { pairs.push(pair); pair = [c]; used = w; }
      else { pair.push(c); used += add; }
    }
    if (pair.length) pairs.push(pair);
    for (const row of pairs) {
      let rows = 1;
      cx = x0;
      for (const c of row) {
        const w = row.length === 1 ? avail : widthOf(c);
        rows = Math.max(rows, drawRule(c.name, c.items, cx, cx + w, top));
        cx += w + COLGAP;
      }
      top += 24 + (rows - 1) * PITCH + PH + 30;
    }
    height = top - 30 + 16;
  }

  box.innerHTML = `<svg viewBox="0 0 ${W} ${Math.round(height)}" role="img" aria-roledescription="railroad" aria-label="模型语法图">${body}</svg>`;
  const sel = box.querySelector(".pill.sel");
  if (sel && !kb.on) sel.scrollIntoView({ block:"nearest", behavior: reduceMotion ? "auto" : "smooth" });
  paintKb();   // 重画之后 DOM 全换了，焦点环得重新钉到同一个格子上
  return box;
};

// ── 键盘：列是焦点 ──
//   ↑↓ 列内移动，←→ 换列，↵ 就是“点它”（走 actOn，跟鼠标同一份判断，不写第二套），
//   Esc 收回，直接打字 = 回搜索框接着打。
//   焦点存在 kb 里而不是靠 DOM 的 document.activeElement：renderDiagram 每次都把整个
//   <svg> 重建，真焦点会跟着旧节点一起消失 —— 换一个模型列表就“键盘失忆”了。
let kb = { on: false, col: 0, row: 0 };
const kbCols = () => [...$("diagram").querySelectorAll("g.rule")].map((r) => [...r.querySelectorAll("g.pill")]);
/** 从搜索框按 ↓ 进来时落在“你已经选中的那一行”，不是第一行 —— 你在哪儿就从哪儿往下走。 */
const kbHome = (cols) => {
  for (let c = 0; c < cols.length; c++) {
    const r = cols[c].findIndex((g) => g.classList.contains("sel"));
    if (r !== -1) return { col: c, row: r };
  }
  return { col: Math.min(1, cols.length - 1), row: 0 };
};
const kbOff = () => {
  kb.on = false;
  $("diagram").querySelectorAll(".pill.kb").forEach((g) => g.classList.remove("kb"));
};
const paintKb = () => {
  const cols = kbCols();
  if (!kb.on || !cols.length) return;
  kb.col = Math.max(0, Math.min(kb.col, cols.length - 1));
  const col = cols[kb.col];
  if (!col.length) return;
  kb.row = Math.max(0, Math.min(kb.row, col.length - 1));
  $("diagram").querySelectorAll(".pill.kb").forEach((g) => g.classList.remove("kb"));
  const g = col[kb.row];
  g.classList.add("kb");
  g.focus?.({ preventScroll: true });     // 真焦点留着（读屏器和 Tab 还能用）；视觉全靠 .kb 那道环
  g.scrollIntoView({ block:"nearest", behavior: reduceMotion ? "auto" : "smooth" });
};

addEventListener("keydown", (e) => {
  if ($("scrim").hidden) return;
  if (e.key === "Escape") { e.preventDefault(); closeSheet(); return; }
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  const inQ = e.target === $("q");
  const cols = kbCols();

  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    const dir = e.key === "ArrowDown" ? 1 : -1;
    if (!kb.on) {
      if (dir < 0) return;                       // 搜索框上按 ↑ 没地方去
      kb = { on: true, ...kbHome(cols) };
    } else if (dir < 0 && kb.row === 0 && kb.col === 0) {
      kbOff(); $("q").focus(); return;            // 从最顶上再往上 = 回搜索框
    } else {
      const len = (cols[kb.col] ?? []).length;
      if (kb.row + dir < 0 || kb.row + dir >= len) { e.preventDefault(); return; }   // 到头就停，不绕圈
      kb.row += dir;
    }
    e.preventDefault(); paintKb(); return;
  }

  if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
    if (!kb.on) return;
    e.preventDefault();
    kb.col = Math.max(0, Math.min(cols.length - 1, kb.col + (e.key === "ArrowRight" ? 1 : -1)));
    paintKb(); return;
  }

  if (e.key === "Enter") {
    if (inQ) return;                             // 搜索框里的 ↵ 归它自己的 onkeydown
    const g = (cols[kb.col] ?? [])[kb.row];
    if (!g) return;
    e.preventDefault(); actOn(g); return;
  }

  // 在药丸上直接打字：回搜索框接着打，键盘流别断在这里
  if (kb.on && !inQ && (e.key.length === 1 || e.key === "Backspace")) {
    e.preventDefault(); kbOff();
    $("q").focus();
    $("q").value = e.key === "Backspace" ? $("q").value.slice(0, -1) : $("q").value + e.key;
    renderDiagram();
  }
});

const choose = (provider, modelId) => {
  picked = { provider, modelId };
  pickProvider = provider;
  thinking = clampLevel(thinking, levelsOfPick());   // 换了模型，档位跟着它的表重新夹
  $("flash").textContent = "";
  renderCurrent();
  renderDiagram();
  updateHub();
  setTimeout(closeSheet, reduceMotion ? 0 : 220);   // 让选中那格先亮一下，再原路收回
};
/** 药丸点击的三种走法，键盘那边用的是同一份判断 —— 别写两套。 */
const actOn = (g) => {
  // 思考档位：只改档位，不开不关 —— 它跟“选哪个模型”是两件事
  if (g.classList.contains("lv")) { thinking = g.dataset.m; renderCurrent(); renderDiagram(); return; }
  // 供应商：只切换模型列的视图，也不关门
  if (g.classList.contains("pv")) { pickProvider = g.dataset.p; renderDiagram(); return; }
  choose(g.dataset.p, g.dataset.m);
};
$("diagram").addEventListener("click", (e) => {
  const g = e.target.closest(".pill");
  if (g) actOn(g);
});
$("diagram").addEventListener("keydown", (e) => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const g = e.target.closest?.(".pill");
  if (!g) return;
  e.preventDefault();
  actOn(g);
});
$("q").oninput = renderDiagram;
// 搜索框里的 ↵：点「匹配」那一列的第一条。**不能写成 `pill.click()`** —— SVG <g>
// 不是 HTMLElement，没有 `.click()`（以前这行一直在抛异常，按回车没反应也不报错）；
// 也不能取第一支药丸 —— 那是供应商列，在它上面 ↵ 只是换列视图，不选模型。
$("q").onkeydown = (e) => {
  if (e.key !== "Enter") return;
  const first = $("diagram").querySelectorAll("g.rule")[1]?.querySelector(".pill");
  if (!first) return;
  e.preventDefault();
  actOn(first);
};

const renderCurrent = () => {
  if (!picked) {
    $("cur-id").textContent = "—";
    $("cur-tag").textContent = models.length ? "选择 ›" : "无模型";
    $("model-sub").textContent = models.length ? `已开放 · ${models.length} 款` : "没有可用模型";
    return;
  }
  const m = models.find((x) => x.provider === picked.provider && x.modelId === picked.modelId);
  $("cur-id").textContent = picked.modelId;
  $("cur-tag").textContent = m?.provider ?? "";
  const isDef = defaultModel && defaultModel.provider === picked.provider && defaultModel.modelId === picked.modelId;
  const lv = levelsOfPick();
  $("model-sub").textContent = `已开放 · ${models.length} 款${isDef ? " · 默认" : ""}`
    + (lv.length > 1 ? ` · 思考 ${thinking}` : "");
};

const updateHub = () => {
  $("create").disabled = !picked || !tag;
  $("choose").disabled = !models.length;
};

$("create").onclick = commit;
async function commit() {
  if (!picked) return;
  $("create").disabled = true;
  $("flash").textContent = "";
  try {
    const name = $("name").value.trim();
    // 档位跟着创建一起发 —— 服务端在建会话的同一个 commit 里落定，
    // 中间不会有“已经跑了一条消息但档位还是旧的”那一瞬。
    const created = await post(tag.url + "/v1/sessions", { model: picked, thinkingLevel: thinking, ...(name ? { name } : {}) });
    await post(tag.url + "/v1/selection", { id: created.id });   // 盘上那只眼睛跟着切过去
    // 服务端回来的才是生效值（它夹过一遍）：认这一份，不认我们发上去的
    if (created.thinkingLevel) thinking = created.thinkingLevel;
    $("flash").textContent = `✓ 对话 ${created.id} 已创建 · 思考 ${thinking}`;
    $("name").value = "";
    defaultModel = picked;
    renderCurrent();
    if (!$("scrim").hidden) closeSheet();
  } catch (error) {
    $("flash").textContent = "";
    $("errbox").innerHTML = `<div class="err">创建失败：${String(error.message ?? error)}</div>`;
  }
  $("create").disabled = false;
}

if (tag) {
  try {
    const data = await api("v1/models");
    models = data.items ?? [];
    defaultModel = data.default ?? null;
    picked = defaultModel;
    $("state").textContent = models.length ? `${models.length} 款可用` : "";
  } catch (error) {
    $("errbox").innerHTML = `<div class="err">拿不到模型清单：${String(error.message ?? error)}</div>`;
  }
}
renderCurrent();
updateHub();
</script>
</body>
</html>
