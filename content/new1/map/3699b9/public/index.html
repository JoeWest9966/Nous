<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="data:," />
    <title>presets · Nous 预设</title>
    <link rel="stylesheet" href="./style.css?v=2" />
    <link rel="stylesheet" href="./board.css?v=1" />
    <script>
      // 宿主把这一块挂在某个前缀下面（可能没有尾斜杠）。没有它，./style.css 会解析到上一层去。
      if (!location.pathname.endsWith("/")) {
        location.replace(location.pathname + "/" + location.search + location.hash);
      }
    </script>
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 4.5h9l5 5V19a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 5 19z" />
          <path d="M14 4.5V10h5" />
          <path d="M8.5 14h7M8.5 17h4.5" />
        </svg>
        <div class="titles">
          <h1>预设</h1>
          <p id="crumb">—</p>
        </div>
      </div>
      <div class="top-right">
        <span class="hint" id="repo">—</span>
        <button class="chip-status" id="sync" type="button" title="仓库状态（点一下重新问 qrd3wh）">
          <span class="dot" id="sync-dot"></span><span id="sync-text">—</span>
        </button>
        <button class="btn btn-small" id="refresh" type="button" title="重新问一遍 qrd3wh（不写盘、不提交）">
          重扫
        </button>
      </div>
    </header>

    <main class="layout">
      <aside class="rail" id="rail">
        <div class="rail-head">
          <h3>类别</h3>
          <span class="facet-n" id="cat-count">—</span>
        </div>
        <div class="facets" id="facets"></div>
        <div class="rail-new" id="rail-new">
          <button class="rail-add" id="new-cat" type="button" title="建一个空类别（可写路径，如 写作/周报）">
            <span aria-hidden="true">＋</span> 新建类别
          </button>
        </div>
        <p class="rail-foot dim small" id="rail-foot">—</p>
      </aside>

      <section class="main">
        <div class="filters" id="filters" aria-label="筛选"></div>
        <div class="toolbar">
          <span class="result-count" id="result-count">—</span>
          <div class="toolbar-right">
            <button class="btn-new" id="new-preset" type="button" title="建一条空预设（未发布，只有这台有）">
              <span aria-hidden="true">＋</span>新建预设
            </button>
            <label class="search">
              <input id="search" type="search" placeholder="搜预设名 / 摘要 / 类别" autocomplete="off" />
            </label>
          </div>
        </div>
        <div class="scroll" id="scroll">
          <div class="subhead" id="subhead" hidden></div>
          <div class="grid" id="grid"></div>
          <div class="empty" id="empty" hidden></div>
          <div class="archived" id="archived" hidden></div>
        </div>
      </section>
    </main>

    <!-- 右键 / 长按 / ⋯ 的统一菜单 -->
    <div class="ctxmenu" id="ctxmenu" role="menu" hidden></div>

    <!-- 详情：点半扇浮层，不换页（关掉回来还是原来那张网格） -->
    <div class="dt-scrim" id="dt-scrim" hidden></div>
    <aside class="dt" id="detail" hidden tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="dt-name">
      <header class="dt-head">
        <div class="dt-tile" id="dt-tile"><span class="mono" id="dt-mono">—</span></div>
        <div class="dt-titles">
          <div class="dt-title-row">
            <h2 id="dt-name">—</h2>
            <span class="dt-badges" id="dt-badges"></span>
          </div>
          <p class="dim small" id="dt-meta">—</p>
        </div>
        <button class="dt-x" id="dt-close" type="button" title="关闭（Esc）" aria-label="关闭">×</button>
      </header>
      <div class="dt-body" id="dt-body"></div>
      <footer class="dt-foot" id="dt-foot"></footer>
    </aside>

    <!-- 编辑：一个表单 tab + 一个 JSON tab，编的是同一份 preset.json -->
    <div class="ed-scrim" id="ed-scrim" hidden></div>
    <aside class="ed" id="editor" hidden aria-label="预设编辑器">
      <header class="ed-head">
        <div>
          <h2 id="ed-name">—</h2>
          <p class="dim small" id="ed-meta">—</p>
        </div>
        <div class="ed-actions">
          <span class="ed-state" id="ed-state"></span>
          <button class="ed-btn" id="ed-publish" title="校验 + commit + push">发布</button>
          <button class="ed-x" id="ed-close" title="关闭（Esc）" aria-label="关闭">×</button>
        </div>
      </header>
      <div class="ed-tabs" role="tablist">
        <button class="ed-tab on" id="ed-tab-form" data-mode="form" role="tab" aria-selected="true" title="盘面（Alt+D 切 JSON）">
          盘面
        </button>
        <button class="ed-tab" id="ed-tab-json" data-mode="json" role="tab" aria-selected="false" title="preset.json 原文（Alt+D 切表单）">
          JSON
        </button>
      </div>
      <div class="ed-stage" id="ed-stage">
        <!-- 盘面：四域 + 中央椭圆（版式照 hb7k3j）。中央是落子的地方 —— 启动 / 保存；
             发布在头部，那是「提交」不是「落子」。 -->
        <div class="board-wrap" id="ed-form">
          <div class="board" id="board">
            <svg class="frame" viewBox="0 0 640 440" preserveAspectRatio="none" aria-hidden="true">
              <path d="M0,0L314.04,0C315.06,27.5,322.13,27.5,323.15,55C315.14,82.5,335.41,82.5,327.39,110C328.99,137.5,322.51,137.5,324.11,165C319.92,192.5,324.19,192.5,320,220C280,225.07,280,210.71,240,215.78C200,204.86,200,227.13,160,216.22C120,223.83,120,218.6,80,226.21C40,222.27,40,221.52,0,217.58Z" fill="var(--s1)" fill-opacity="0.06"/>
              <path d="M314.04,0L640,0L640,222.23C600,231.87,600,212.95,560,222.59C520,213.69,520,227.54,480,218.63C440,224.66,440,213.77,400,219.8C360,218.1,360,221.69,320,220C324.19,192.5,319.92,192.5,324.11,165C322.51,137.5,328.99,137.5,327.39,110C335.41,82.5,315.14,82.5,323.15,55C322.13,27.5,315.06,27.5,314.04,0Z" fill="var(--s2)" fill-opacity="0.06"/>
              <path d="M0,217.58C40,221.52,40,222.27,80,226.21C120,218.6,120,223.83,160,216.22C200,227.13,200,204.86,240,215.78C280,210.71,280,225.07,320,220C339.2,264,291.2,341,329.6,385C300.8,407,325.76,429,320,440L0,440Z" fill="var(--s3)" fill-opacity="0.06"/>
              <path d="M320,220C360,221.69,360,218.1,400,219.8C440,213.77,440,224.66,480,218.63C520,227.54,520,213.69,560,222.59C600,212.95,600,231.87,640,222.23L640,440L320,440C325.76,429,300.8,407,329.6,385C291.2,341,339.2,264,320,220Z" fill="var(--s4)" fill-opacity="0.06"/>
              <g class="b">
                <path d="M314.04,0C315.06,27.5,322.13,27.5,323.15,55C315.14,82.5,335.41,82.5,327.39,110C328.99,137.5,322.51,137.5,324.11,165C319.92,192.5,324.19,192.5,320,220"/>
                <path d="M0,217.58C40,221.52,40,222.27,80,226.21C120,218.6,120,223.83,160,216.22C200,227.13,200,204.86,240,215.78C280,210.71,280,225.07,320,220"/>
                <path d="M320,220C360,221.69,360,218.1,400,219.8C440,213.77,440,224.66,480,218.63C520,227.54,520,213.69,560,222.59C600,212.95,600,231.87,640,222.23"/>
              </g>
              <path class="cliff" d="M320,220C339.2,264,291.2,341,329.6,385C300.8,407,325.76,429,320,440"/>
            </svg>

            <section class="region r1">
              <h2>模型</h2>
              <div class="sub" id="b-model-sub">—</div>
              <div class="nodes">
                <button class="node" id="b-model" type="button" title="这条 preset 钉哪款模型（不钉 = 用设备默认）">
                  <span class="id" id="b-model-id">—</span>
                  <span class="tag" id="b-model-tag">改 ›</span>
                </button>
              </div>
            </section>

            <section class="region r2">
              <h2>上下文</h2>
              <div class="sub" id="b-ctx-sub">—</div>
              <div class="nodes">
                <button class="node" id="b-skills" type="button" title="这条 preset 带哪些技能（集合，模型按需 read）">
                  <span class="id">技能</span>
                  <span class="tag" id="b-skills-tag">—</span>
                </button>
                <button class="node" id="b-tmpl" type="button" title="这条 preset 每轮都带的那份规则（单选）">
                  <span class="id">模板</span>
                  <span class="tag" id="b-tmpl-tag">—</span>
                </button>
              </div>
            </section>

            <section class="region r4">
              <h2>扩展</h2>
              <div class="sub" id="b-ext-sub">—</div>
              <div class="nodes">
                <button class="node" id="b-ext" type="button" title="这条 preset 要装哪些 Nous 扩展">
                  <span class="id" id="b-ext-id">—</span>
                  <span class="tag" id="b-ext-tag">改 ›</span>
                </button>
              </div>
            </section>

            <section class="region r3">
              <h2>权限</h2>
              <div class="sub" id="b-perm-sub">—</div>
              <div class="nodes">
                <button class="node" id="b-readonly" type="button" aria-pressed="false" title="点一下切换：只读 = 不给会写的工具">
                  <span class="id">只读</span>
                  <span class="tag" id="b-ro-tag">关 ›</span>
                </button>
              </div>
            </section>

            <div class="hub">
              <h1 id="b-name">—</h1>
              <div class="sub" id="b-hub-sub">—</div>
              <div class="hub-btns">
                <button class="node cta primary" id="b-launch" type="button" title="先落盘，再拿这条预设开一条新对话">启动</button>
                <button class="node cta" id="b-save" type="button" title="保存到磁盘（Ctrl/⌘+S）—— 不提交">保存</button>
              </div>
              <span id="b-flash"></span>
            </div>
          </div>
        </div>
        <div class="ed-code" id="ed-code" hidden>
          <div class="ed-gutter" id="ed-gutter" aria-hidden="true"></div>
          <textarea class="ed-text" id="ed-text" spellcheck="false" wrap="off" disabled></textarea>
          <div class="ed-diff" id="ed-diff" hidden tabindex="0" aria-label="与 HEAD 的差异"></div>
        </div>
      </div>
      <div class="ed-msg" id="ed-msg" hidden></div>
      <footer class="ed-foot">
        <p class="dim small" id="ed-hint">中央「保存」只落盘；头部「发布」才 commit + push。</p>
      </footer>
    </aside>


    <!-- ── 盘面四个弹窗：筛选框 / 档位 chip / 视图 chip / 右栏类别 / 底栏 ── -->
    <div class="bscrim" id="b-model-scrim" hidden>
      <div class="bsheet" role="dialog" aria-modal="true" aria-label="选择模型">
        <div class="bshead">
          <b>模型</b>
          <input type="text" id="b-mq" placeholder="筛选模型…" autocomplete="off" />
        </div>
        <div class="bdiagram" id="b-diagram"></div>
        <div class="bfoot">
          <span class="hint">供应商 › 模型 › 思考 · ↑↓ 选 · ←→ 换列 · ↵ 确认 · Esc 关闭</span>
          <button class="blink" id="b-model-auto" type="button" title="清掉 model 这个键，开会话时用设备默认">不钉模型 · 跟随设备默认 ›</button>
        </div>
      </div>
    </div>

    <div class="bscrim" id="b-skill-scrim" hidden>
      <div class="bsheet" role="dialog" aria-modal="true" aria-label="选择技能">
        <div class="bshead">
          <b>上下文 · 技能</b>
          <input type="text" id="b-sq" placeholder="筛选技能…" autocomplete="off" />
        </div>
        <div class="bmodes" id="b-skill-modes">
          <button class="bmode" type="button" data-mode="default" aria-pressed="false" title="preset.json 里不写 skills —— 开会话时按默认走">跟随默认</button>
          <button class="bmode" type="button" data-mode="none" aria-pressed="false" title="skills: [] —— 明确一个都不要">都不要</button>
          <button class="bmode" type="button" data-mode="picked" aria-pressed="false" title="钉住下面勾中的这几条">挑几个</button>
        </div>
        <div class="bviews" id="b-skill-views">
          <button class="bchip" type="button" data-view="all" aria-pressed="true"></button>
          <button class="bchip" type="button" data-view="none" aria-pressed="false"></button>
          <button class="bchip" type="button" data-only="1" aria-pressed="false"></button>
        </div>
        <div class="bbody" id="b-skill-body">
          <div class="blist" id="b-skill-list"></div>
          <div class="brail" id="b-skill-rail" hidden>
            <div class="rhead">类别</div>
            <div class="brail-list" id="b-skill-rail-list"></div>
            <div class="rfoot"><a id="b-skill-rail-go" href="#" target="_blank" rel="noreferrer">+ 新建类别：去技能页</a></div>
          </div>
        </div>
        <div class="bfoot">
          <span class="hint" id="b-skill-hint">—</span>
          <button class="bdone" id="b-skill-done" type="button">完成 ›</button>
        </div>
      </div>
    </div>

    <div class="bscrim" id="b-tmpl-scrim" hidden>
      <div class="bsheet" role="dialog" aria-modal="true" aria-label="选择提示词模板">
        <div class="bshead">
          <b>上下文 · 模板</b>
          <input type="text" id="b-tq" placeholder="筛选模板…" autocomplete="off" />
        </div>
        <div class="bmodes" id="b-tmpl-modes">
          <button class="bmode" type="button" data-mode="default" aria-pressed="false" title="preset.json 里不写 template —— 开会话时用仓库 settings.json 的默认值">跟随默认</button>
          <button class="bmode" type="button" data-mode="none" aria-pressed="false" title="template: null —— 明确一条都不要">都不要</button>
          <button class="bmode" type="button" data-mode="picked" aria-pressed="false" title="钉住下面选中的那一条">钉一条</button>
        </div>
        <div class="bviews" id="b-tmpl-views">
          <button class="bchip" type="button" data-view="all" aria-pressed="true"></button>
          <button class="bchip" type="button" data-view="basics" aria-pressed="false"></button>
          <button class="bchip" type="button" data-view="none" aria-pressed="false"></button>
          <button class="bchip" type="button" data-only="1" aria-pressed="false"></button>
        </div>
        <div class="bbody" id="b-tmpl-body">
          <div class="blist" id="b-tmpl-list"></div>
          <div class="brail" id="b-tmpl-rail" hidden>
            <div class="rhead">类别</div>
            <div class="brail-list" id="b-tmpl-rail-list"></div>
            <div class="rfoot"><a id="b-tmpl-rail-go" href="#" target="_blank" rel="noreferrer">+ 新建类别：去模板页</a></div>
          </div>
        </div>
        <div class="bfoot">
          <span class="hint" id="b-tmpl-hint">—</span>
          <button class="bdone" id="b-tmpl-done" type="button">完成 ›</button>
        </div>
      </div>
    </div>

    <div class="bscrim" id="b-ext-scrim" hidden>
      <div class="bsheet" role="dialog" aria-modal="true" aria-label="选择扩展">
        <div class="bshead">
          <b>扩展</b>
          <input type="text" id="b-eq" placeholder="筛选扩展…" autocomplete="off" />
        </div>
        <div class="bmodes" id="b-ext-modes">
          <button class="bmode" type="button" data-mode="default" aria-pressed="false" title="preset.json 里不写 extensions —— 开会话时按默认走">跟随默认</button>
          <button class="bmode" type="button" data-mode="none" aria-pressed="false" title="extensions: [] —— 明确一个都不装">都不要</button>
          <button class="bmode" type="button" data-mode="picked" aria-pressed="false" title="钉住下面选中的这几个">挑几个</button>
        </div>
        <div class="bviews" id="b-ext-views">
          <button class="bchip" type="button" data-view="all" aria-pressed="true"></button>
          <button class="bchip" type="button" data-view="basics" aria-pressed="false"></button>
          <button class="bchip" type="button" data-view="none" aria-pressed="false"></button>
          <button class="bchip" type="button" data-only="1" aria-pressed="false"></button>
        </div>
        <div class="bbody" id="b-ext-body">
          <div class="blist" id="b-ext-list"></div>
          <div class="brail" id="b-ext-rail" hidden>
            <div class="rhead">类别</div>
            <div class="brail-list" id="b-ext-rail-list"></div>
            <div class="rfoot"><a id="b-ext-rail-go" href="#" target="_blank" rel="noreferrer">+ 新建类别：去模板页</a></div>
          </div>
        </div>
        <div class="bfoot">
          <span class="hint" id="b-ext-hint">—</span>
          <button class="bdone" id="b-ext-done" type="button">完成 ›</button>
        </div>
      </div>
    </div>

    <!-- 启动确认：名字 + 生效配置一览 + 会跳过什么 -->
    <div class="sheet-scrim" id="launch-scrim" hidden></div>
    <div class="sheet" id="launch" hidden role="dialog" aria-modal="true" aria-labelledby="launch-title">
      <h2 id="launch-title">开一条新对话</h2>
      <p class="sheet-hint dim" id="launch-hint">—</p>
      <div class="sheet-body" id="launch-body"></div>
      <label class="field">
        <span>会话名</span>
        <input id="launch-name" type="text" maxlength="120" autocomplete="off" />
      </label>
      <p class="sheet-err" id="launch-err" hidden></p>
      <div class="sheet-foot">
        <button class="btn" id="launch-cancel" type="button">取消</button>
        <button class="btn btn-go" id="launch-ok" type="button">开对话</button>
      </div>
    </div>

    <!-- 新建预设：只问四样 -->
    <div class="sheet-scrim" id="create-scrim" hidden></div>
    <form class="sheet" id="create" hidden role="dialog" aria-modal="true" aria-labelledby="create-title">
      <h2 id="create-title">新建预设</h2>
      <p class="sheet-hint dim">
        一条预设 = 一组「开这条会话时用什么」的引用。建完是<b>未发布</b>：只在你这台、远端看不到，满意了再点发布。
      </p>
      <label class="field">
        <span>名字 <i class="dim">小写字母 / 数字开头，只留 . _ -</i></span>
        <input id="create-name" type="text" maxlength="64" autocomplete="off" spellcheck="false" />
        <i class="field-warn">名字就是会话里的键，<b>建完改不了</b>。想换就归档旧的、建新的。</i>
      </label>
      <label class="field">
        <span>一句话摘要 <i class="dim">卡片上那一行，人靠它决定开不开</i></span>
        <input id="create-summary" type="text" maxlength="200" autocomplete="off" />
      </label>
      <label class="field">
        <span>类别 <i class="dim">可空 = 未分类；写个不存在的名字就顺手建了</i></span>
        <input id="create-cat" type="text" autocomplete="off" placeholder="写作/周报" />
      </label>
      <label class="field">
        <span>起手</span>
        <select id="create-from">
          <option value="blank">空白（模型 / 模板都跟随默认）</option>
          <option value="device">钉住当前设备默认模型</option>
        </select>
      </label>
      <p class="sheet-err" id="create-err" hidden></p>
      <div class="sheet-foot">
        <button class="btn" id="create-cancel" type="button">取消</button>
        <button class="btn btn-primary" id="create-ok" type="submit">建</button>
      </div>
    </form>

    <!-- 破坏性操作：手输名字才亮 -->
    <div class="sheet-scrim" id="danger-scrim" hidden></div>
    <div class="sheet danger" id="danger" hidden role="dialog" aria-modal="true" aria-labelledby="danger-title">
      <h2 id="danger-title">—</h2>
      <p class="sheet-hint dim" id="danger-hint"></p>
      <label class="field">
        <span>手输<b id="danger-word">名字</b>确认：<code id="danger-name">—</code></span>
        <input id="danger-input" type="text" autocomplete="off" spellcheck="false" />
      </label>
      <p class="sheet-err" id="danger-err" hidden></p>
      <div class="sheet-foot">
        <button class="btn" id="danger-cancel" type="button">取消</button>
        <button class="btn btn-bad" id="danger-ok" type="button" disabled>确定</button>
      </div>
    </div>

    <div class="toasts" id="toasts" aria-live="polite"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
