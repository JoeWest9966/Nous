[workspace]
resolver = "2"
members = ["crates/nous-engine", "crates/nous-desktop"]
default-members = ["crates/nous-engine"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "io-util"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
thiserror = "2"
url = "2"
bytes = "1"
smol = "2"

[profile.release]
lto = "thin"
