[package]
name = "nous-desktop"
description = "Nous 桌面客户端（微信桌面版的样子）。GPUI + gpui-kit。"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# 铁律：只吃 gpui-kit 的重导出，别再加一条 gpui-pre。
gpui-kit = { version = "0.9.0", features = ["component", "assets"] }
nous-engine = { path = "../nous-engine" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
futures-util.workspace = true
log = "0.4"
toml = "0.8"
dirs = "6"
smol = "2"

# cargo-packager 的元数据：出 Windows 安装包用（见 .github/workflows/windows.yml）。
[package.metadata.packager]
product_name = "Nous Desktop"
identifier = "com.joewest.nous.desktop"
description = "Nous 桌面客户端"
publisher = "JoeWest9966"
homepage = "https://github.com/JoeWest9966/nous-desktop"
authors = ["JoeWest9966"]
out_dir = "../../dist"
icons = ["../../assets/icon.png", "../../assets/icon.ico"]
binaries = [{ path = "nous-desktop", main = true }]
# msi/nsis 会把 resources 放在 exe 旁边 —— 和便携包一个位置，应用按 current_exe() 找得到。
resources = [{ src = "../../dist/desktop.toml", target = "desktop.toml" }]
