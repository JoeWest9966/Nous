[package]
name = "nousdesk"
description = "NousDesk 桌面客户端（微信桌面版的样子）。GPUI + gpui-kit。"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# 铁律：只吃 gpui-kit 的重导出，别再加一条 gpui-pre。
gpui-kit = { version = "0.9.0", features = ["component", "assets"] }
nous-engine = { path = "../nous-engine" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
futures-util.workspace = true
log = "0.4"
# 语法高亮：gpui-kit 的 `syntect` feature 只喂 TextInput，markdown 代码块不吃它
# （gpui-component 里 highlight_code 是 pub(crate)，也没接到 TextView 上）。
# 所以高亮得自己算，直接把 syntect 挂上来。`regex-fancy` 是纯 Rust，不用 C 编译器。
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
toml = "0.8"
dirs = "6"
smol = "2"
# 只用来把 epoch ms 转成本地时间（列表右上角那格）。别拿它做业务。
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# cargo-packager 的元数据：出 Windows 安装包用（见 .github/workflows/windows.yml）。
[package.metadata.packager]
product_name = "NousDesk"
# 安装包的升级身份。**改名时刻意不动**：换掉它等于新产品，老版本既升不上来、
# 也没法覆盖安装（用户得先手动卸载）。要换就单独发一版做迁移。
identifier = "com.joewest.nous.desktop"
description = "NousDesk 桌面客户端"
publisher = "JoeWest9966"
homepage = "https://github.com/JoeWest9966/NousDesk"
authors = ["JoeWest9966"]
out_dir = "../../dist"
icons = ["../../assets/icon.png", "../../assets/icon.ico"]
binaries = [{ path = "nousdesk", main = true }]
# msi/nsis 会把 resources 放在 exe 旁边 —— 和便携包一个位置，应用按 current_exe() 找得到。
resources = [{ src = "../../dist/desktop.toml", target = "desktop.toml" }]
