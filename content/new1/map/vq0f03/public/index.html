<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>vps · 编目</title>
    <link rel="stylesheet" href="./style.css" />
    <script>
      // 宿主把这块挂在 /p/new1/vq0f03（可能没有尾斜杠）。没有它，./style.css 会解析到上一层去。
      if (!location.pathname.endsWith("/")) {
        location.replace(location.pathname + "/" + location.search + location.hash);
      }
    </script>
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="4" width="18" height="6" rx="1.5" />
          <rect x="3" y="14" width="18" height="6" rx="1.5" />
          <circle cx="6.5" cy="7" r="1" />
          <circle cx="6.5" cy="17" r="1" />
        </svg>
        <div class="titles">
          <h1>vps</h1>
          <p>new1<span class="sep">/</span>vq0f03<span class="sep">·</span><span id="count">—</span></p>
        </div>
      </div>
      <button class="chip-status" id="health" title="点一下重新问一次上游">
        <span class="dot" data-state="wait"></span>
        <span class="mono" id="health-text">连上游…</span>
      </button>
      <div class="actions">
        <button class="ghost" id="refresh" title="跳过缓存重取一遍清单">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.6-3.7M13 3v3h-3" /></svg>
          刷新
        </button>
        <button class="primary" id="add">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10" /></svg>
          登记服务器
        </button>
      </div>
    </header>

    <div class="notice" id="notice" hidden></div>

    <main id="main">
      <section class="canvas" id="canvas" aria-label="编目拓扑">
        <svg class="edges" id="edges" aria-hidden="true"></svg>
        <div class="col panel-col">
          <section class="group" data-kind="panel">
            <header class="g-head">
              <span class="g-name">panel</span>
              <span class="g-meta mono" id="panel-meta">—</span>
            </header>
            <button class="node hub" id="hub" title="nw-panel：清单的唯一来源">
              <span class="ico">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="4" y="3" width="16" height="7" rx="1.5" />
                  <rect x="4" y="14" width="16" height="7" rx="1.5" />
                  <path d="M7 6.5h.01M7 17.5h.01M12 10v4" />
                </svg>
              </span>
              <span class="body">
                <span class="nm">nw-panel</span>
                <span class="meta mono" id="panel-url">j1900</span>
                <span class="meta dim mono" id="panel-catalog">—</span>
              </span>
              <span class="reach" id="panel-reach">…</span>
            </button>
          </section>
        </div>

        <div class="col groups-col" id="groups"></div>
        <p class="legend">
          <span class="dot" data-state="ok"></span> 通
          <span class="sep">·</span>
          <span class="dot" data-state="bad"></span> 不通
          <span class="sep">·</span>
          线上的毫秒是本机对那个端口的实测握手耗时，不是面板报的
        </p>
      </section>

      <aside class="drawer" id="drawer" hidden aria-label="服务器详情"></aside>
    </main>

    <footer class="foot">
      <span>清单活在 <code>/opt/Data-001/vps/vps.json</code>（j1900），这里只代理 + 注解</span>
      <span class="sep">·</span>
      <span>写操作没有二次确认之外的门 —— 面板回环零认证，tailnet 就是边界</span>
      <span class="sep">·</span>
      <a id="docs-link" href="./api/catalog" target="_blank" rel="noreferrer">api/catalog</a>
    </footer>

    <div class="menu" id="menu" hidden role="menu" aria-label="操作菜单"></div>
    <div class="toasts" id="toasts" aria-live="polite"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
